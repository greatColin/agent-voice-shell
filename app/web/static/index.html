        }

        // Messages
        function appendMessage(role, text) {
            const list = document.getElementById('messages-list');
            if (!list) return;

            const empty = list.querySelector('.empty-state');
            if (empty) empty.remove();

            const item = document.createElement('div');
            item.className = `msg-item ${role}`;

            const meta = document.createElement('div');
            meta.className = 'msg-meta';
            const name = document.createElement('span');
            name.textContent = role === 'user' ? '你' : 'AI';
            const time = document.createElement('span');
            time.textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            meta.appendChild(name);
            meta.appendChild(time);

            const body = document.createElement('div');
            body.className = 'msg-text';
            body.textContent = text;

            item.appendChild(meta);
            item.appendChild(body);
            list.appendChild(item);
            list.scrollTop = list.scrollHeight;
        }

        function appendAssistantText(delta) {
            let lastMsg = document.querySelector('.msg-item.assistant:last-child');
            if (!lastMsg) {
                state.lastSpokenLength = 0;
                state.assistantActive = true;
                const list = document.getElementById('messages-list');
                if (!list) return;
                lastMsg = document.createElement('div');
                lastMsg.className = 'msg-item assistant';

                const meta = document.createElement('div');
                meta.className = 'msg-meta';
                const name = document.createElement('span');
                name.textContent = 'AI';
                const time = document.createElement('span');
                time.textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                meta.appendChild(name);
                meta.appendChild(time);

                const body = document.createElement('div');
                body.className = 'msg-text';

                lastMsg.appendChild(meta);
                lastMsg.appendChild(body);
                list.appendChild(lastMsg);
                setAgentStatus('thinking');
            }
            state.currentText += delta;
            lastMsg.querySelector('.msg-text').textContent = state.currentText;

            // Speak only the not-yet-spoken tail; while an utterance is still
            // playing (or the mic is open), chunks accumulate and get included
            // in the next speak.
            if (!state.isSpeaking && !state.isListening) {
                const toSpeak = state.currentText.slice(state.lastSpokenLength);
                if (toSpeak.length > 3) {
                    speakText(toSpeak);
                    state.lastSpokenLength = state.currentText.length;
                }
            }
        }

        function finalizeAssistantMessage() {
            const list = document.getElementById('messages-list');
            if (list) {
                const lastMsg = list.querySelector('.msg-item.assistant:last-child');
                if (lastMsg) lastMsg.querySelector('.msg-text').textContent = state.currentText || '...';
            }
            state.lastFinalText = state.currentText;
            state.currentText = '';
            state.lastSpokenLength = 0;
            state.assistantActive = false;
            if (!state.isListening) setAgentStatus('idle');
        }

        // ASR/TTS
        // Lower = better. Prefer modern neural voices over legacy SAPI ones.
        function voiceRank(v) {
            const n = v.name.toLowerCase();
            if (n.includes('huihui')) return 0;
            if (n.includes('neural') || n.includes('online') || n.includes('natural')) return 1;
            if (n.includes('yating')) return 1;
            if (n.includes('tingting') || n.includes('meijia')) return 2;
            return 3;
        }

        function pickZhVoice() {
            const voices = window.speechSynthesis.getVoices();
            if (state.ttsVoiceName) {
                const chosen = voices.find(v => v.name === state.ttsVoiceName);
                if (chosen) return chosen;
            }
            const zh = voices.filter(v => (v.lang || '').toLowerCase().startsWith('zh'));
            zh.sort((a, b) => voiceRank(a) - voiceRank(b) || a.name.localeCompare(b.name));
            return zh[0] || null;
        }

        async function refreshTtsVoiceSelect() {
            const sel = document.getElementById('tts-voice-select');
            if (!sel) return;
            if (state.ttsProvider === 'sherpa-onnx') {
                const statusEl = document.getElementById('sherpa-tts-status');
                try {
                    const res = await fetch('/api/tts/status');
                    const data = await res.json();
                    if (!data.ready) {
                        if (statusEl) { statusEl.textContent = '未就绪'; statusEl.className = 'provider-status'; }
                        sel.innerHTML = '<option value="">-- 模型未就绪 --</option>';
                        return;
                    }
                    state.localSherpaVoices = data.voices || [];
                    if (statusEl) { statusEl.textContent = '在线'; statusEl.className = 'provider-status supported'; }
                    sel.innerHTML = (data.voices || []).map(v =>
                        `<option value="${v.id}">${v.label}</option>`
                    ).join('');
                    sel.onchange = () => { speakText('你好，这是一段试听。'); };
                    sel.onchange = null;
                } catch (e) {
                    if (statusEl) { statusEl.textContent = '离线'; statusEl.className = 'provider-status'; }
                    sel.innerHTML = '<option value="">-- 连接失败 --</option>';
                }
                return;
            }
            // browser-tts
            if (!window.speechSynthesis) return;
            const zh = window.speechSynthesis.getVoices()
                .filter(v => (v.lang || '').toLowerCase().startsWith('zh'));
            zh.sort((a, b) => voiceRank(a) - voiceRank(b) || a.name.localeCompare(a.name, b.name));
            if (!zh.length) return;
            sel.innerHTML = zh.map(v => `<option value="${v.name.replace(/"/g, '&quot;')}">${v.name}</option>`).join('');
            const current = zh.find(v => v.name === state.ttsVoiceName) || zh[0];
            sel.value = current.name;
            state.ttsVoiceName = current.name;
            sel.onchange = () => {
                state.ttsVoiceName = sel.value;
                localStorage.setItem('voice-shell-tts-voice', sel.value);
                speakText('你好，这是一段试听。');
            };
        }

        function speakText(text) {
            if (state.ttsProvider === 'sherpa-onnx') { speakSherpaTts(text); return; }
            if (state.ttsProvider !== 'browser-tts' || !window.speechSynthesis) return;
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'zh-CN'; u.rate = 1.2;
            const voice = pickZhVoice();
            if (voice) u.voice = voice;
            u.onstart = () => { state.isSpeaking = true; setAgentStatus('speaking'); };
            u.onend = u.onerror = () => {
                state.isSpeaking = false;
                if (state.pendingTail) {
                    const tail = state.pendingTail;
                    state.pendingTail = '';
                    speakText(tail);
                } else if (!state.isListening) setAgentStatus('idle');
            };
            window.speechSynthesis.speak(u);
        }

        function stopTts() {
            if (window.speechSynthesis) {
                if (speechSynthesis.paused) { try { speechSynthesis.resume(); } catch (e) {} }
                window.speechSynthesis.cancel();
            }
            const audioEl = document.getElementById('sherpa-tts-audio');
            if (audioEl) { audioEl.pause(); audioEl.src = ''; }
            state.isSpeaking = false;
            state.pendingTail = '';
        }

        function speakSherpaTts(text) {
            const voiceSel = document.getElementById('tts-voice-select');
            const voiceId = voiceSel && voiceSel.value !== '' ? voiceSel.value : '0';
            const audioEl = document.getElementById('sherpa-tts-audio');
            if (!audioEl) return;
            const url = `/api/tts/speak?text=${encodeURIComponent(text)}&voice=${encodeURIComponent(voiceId)}&speed=1.0`;
            state.isSpeaking = true;
            setAgentStatus('speaking');
            audioEl.src = url;
            audioEl.play().catch(() => {
                state.isSpeaking = false;
                if (!state.isListening) setAgentStatus('idle');
            });
            audioEl.onended = () => {
                audioEl.onended = null;
                state.isSpeaking = false;
                if (state.pendingTail) {
                    const tail = state.pendingTail;
                    state.pendingTail = '';
                    speakText(tail);
                } else if (!state.isListening) {
                    setAgentStatus('idle');
                }
            };
            audioEl.onerror = () => {
                audioEl.onerror = null;
                state.isSpeaking = false;
                if (!state.isListening) setAgentStatus('idle');
            };
        }

        function _ensureTtsAudioCtx() {
            if (state.ttsAudioCtx) return state.ttsAudioCtx;
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return null;
            state.ttsAudioCtx = new Ctx({ sampleRate: 24000 });
            return state.ttsAudioCtx;
        }

        function _playNextTtsAudio() {
            while (state.ttsAudioQueue.length > 0 && state.ttsAudioQueue[0].index === state.ttsExpectedIndex) {
                const item = state.ttsAudioQueue.shift();
                state.ttsExpectedIndex++;
                const ac = _ensureTtsAudioCtx();
                if (!ac) break;
                ac.decodeAudioData(item.arrayBuffer, (buf) => {
                    const src = ac.createBufferSource();
                    src.buffer = buf;
                    src.connect(ac.destination);
                    src.onended = () => {
                        state.isSpeaking = false;
                        if (!state.isListening) setAgentStatus('idle');
                        _playNextTtsAudio();
                    };
                    src.start();
                    state.isSpeaking = true;
                    setAgentStatus('speaking');
                }, () => {});
                return;
            }
        }

        function _queueTtsAudio(b64, index) {
            const binary = atob(b64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            state.ttsAudioQueue.push({ arrayBuffer: bytes.buffer, index });
            state.ttsAudioQueue.sort((a, b) => a.index - b.index);
            if (!state.isSpeaking) _playNextTtsAudio();
        }

        function setListeningVisual(on) {
            document.querySelectorAll('#voice-btn, .voice-mic-btn').forEach(b => {
                b.classList.toggle('recording', on);
                b.classList.toggle('listening', on);
            });
        }

        // ===== Voice Waveform =====
        // Live mic amplitude → bar graph, to confirm audio is actually being captured.
        let voiceAudio = null;
        function _setupVoiceAudio() {
            if (voiceAudio) return voiceAudio;
            const debug = window.__voiceDebug || {};
            const sourceFactory = debug.createAnalyser;
            if (typeof sourceFactory === 'function') {
                voiceAudio = sourceFactory();
                return voiceAudio;
            }
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return null;
            const audioCtx = new Ctx();
            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.55;
            voiceAudio = { audioCtx, analyser, sourceNode: null, release: null };
            if (!navigator.mediaDevices?.getUserMedia) return voiceAudio;
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    const source = audioCtx.createMediaStreamSource(stream);
                    source.connect(analyser);
                    voiceAudio.sourceNode = source;
                    voiceAudio.release = () => {
                        try { source.disconnect(); } catch (e) {}
                        stream.getTracks().forEach(t => t.stop());
                    };
                })
                .catch(err => {
                    console.warn('getUserMedia failed:', err);
                    voiceAudio.permissionError = err?.name || 'NotAllowedError';
                });
            return voiceAudio;
        }

        function _readAmplitudes(buf, bars) {
            // Time-domain bytes (0..255, 128=idle). Map to [0..1] per bar.
            const step = Math.floor(buf.length / bars);
            const out = new Array(bars);
            for (let i = 0; i < bars; i++) {
                let sum = 0;
                const start = i * step;
                const end = Math.min(buf.length, start + step);
                for (let j = start; j < end; j++) {
                    const v = (buf[j] - 128) / 128;
                    sum += v * v;
                }
                const rms = Math.sqrt(sum / Math.max(1, end - start));
                // Light compression + minimum noise floor so silence reads as a small idle bar
                out[i] = Math.min(1, Math.pow(rms * 2.4, 0.85));
            }
            return out;
        }

        const _waveRenderers = [];
        function _drawWave(canvas, analyser, bars, gain) {
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const cssW = canvas.clientWidth || canvas.width;
            const cssH = canvas.clientHeight || canvas.height;
            if (canvas.width !== cssW * dpr || canvas.height !== cssH * dpr) {
                canvas.width = cssW * dpr;
                canvas.height = cssH * dpr;
            }
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, cssW, cssH);

            let levels;
            if (analyser) {
                const buf = new Uint8Array(analyser.fftSize || 512);
                analyser.getByteTimeDomainData(buf);
                levels = _readAmplitudes(buf, bars);
            } else {
                levels = new Array(bars).fill(0.08);
            }

            const gap = 3;
            const barW = Math.max(2, (cssW - gap * (bars - 1)) / bars);
            const cy = cssH / 2;
            const maxH = cssH * 0.88;
            const grad = ctx.createLinearGradient(0, 0, 0, cssH);
            grad.addColorStop(0, '#5e5ce6');
            grad.addColorStop(0.5, '#0a84ff');
            grad.addColorStop(1, '#64d2ff');
            ctx.fillStyle = grad;
            ctx.shadowColor = 'rgba(10, 132, 255, 0.45)';
            ctx.shadowBlur = 6;
            for (let i = 0; i < bars; i++) {
                const amp = Math.min(1, (levels[i] || 0) * (gain || 1));
                const h = Math.max(3, amp * maxH);
                const x = i * (barW + gap);
                const y = cy - h / 2;
                const r = Math.min(barW / 2, 3);
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + barW - r, y);
                ctx.quadraticCurveTo(x + barW, y, x + barW, y + r);
                ctx.lineTo(x + barW, y + h - r);
                ctx.quadraticCurveTo(x + barW, y + h, x + barW - r, y + h);
                ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.closePath();
                ctx.fill();
            }
            ctx.shadowBlur = 0;
        }

        function _startWaveforms() {
            const audio = _setupVoiceAudio();
            const canvases = Array.from(document.querySelectorAll('#voice-wave-input, #voice-wave-main'));
            const pills = Array.from(document.querySelectorAll('#voice-wave-pill-input, #voice-wave-pill-main'));
            pills.forEach(p => { p.classList.add('active'); p.classList.remove('error'); });
            _waveRenderers.length = 0;
            canvases.forEach((canvas, idx) => {
                const bars = canvas.id === 'voice-wave-main' ? 9 : 7;
                const gain = canvas.id === 'voice-wave-main' ? 1.0 : 1.4;
                let rafId = null;
                const loop = () => {
                    const analyser = voiceAudio?.analyser;
                    _drawWave(canvas, analyser, bars, gain);
                    rafId = requestAnimationFrame(loop);
                };
                rafId = requestAnimationFrame(loop);
                _waveRenderers.push({ canvas, pill: pills[idx], cancel: () => rafId && cancelAnimationFrame(rafId) });
            });
            // Reflect mic permission failure on the pill (idle bars indicate no signal).
            const checkPermission = () => {
                if (voiceAudio?.permissionError) {
                    pills.forEach(p => p.classList.add('error'));
                    return true;
                }
                return false;
            };
            const t = setInterval(() => { if (checkPermission()) clearInterval(t); }, 300);
            _waveRenderers.push({ cancel: () => clearInterval(t) });
        }

        function _stopWaveforms() {
            while (_waveRenderers.length) {
                try { _waveRenderers.pop().cancel(); } catch (e) {}
            }
            document.querySelectorAll('.voice-wave-pill')
                .forEach(p => p.classList.remove('active'));
            if (voiceAudio) {
                try { voiceAudio.release?.(); } catch (e) {}
                try { voiceAudio.audioCtx?.close?.(); } catch (e) {}
                voiceAudio = null;
            }
        }

        // ===== Sci-Fi Spectrogram (TTS) =====
        // SpeechSynthesis has no analysable stream, so synthesize a virtual
        // spectrum from per-frame time + utterance text length. Idle bars
        // breathe slowly; speaking bars reflect a layered sine mix with a
        // left-to-right scanline and central pink/violet halo.
        const _spectrograms = [];
        function startSpectrogram(canvas, statusEl) {
            const ctx = canvas.getContext('2d');
            let rafId = null;
            let t0 = performance.now();
            const NUM_BARS = 32;
            const setStatus = (txt, live) => {
                if (!statusEl) return;
                statusEl.textContent = txt;
                statusEl.classList.toggle('live', !!live);
            };
            const draw = () => {
                const t = (performance.now() - t0) / 1000;
                const speaking = !!state.isSpeaking;
                const cssW = canvas.clientWidth || 280;
                const cssH = canvas.clientHeight || 140;
                const dpr = window.devicePixelRatio || 1;
                if (canvas.width !== Math.round(cssW * dpr) || canvas.height !== Math.round(cssH * dpr)) {
                    canvas.width = Math.round(cssW * dpr);
                    canvas.height = Math.round(cssH * dpr);
                }
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                // Background gradient (deep space)
                const bg = ctx.createLinearGradient(0, 0, 0, cssH);
                bg.addColorStop(0, 'rgba(10, 8, 32, 0.95)');
                bg.addColorStop(1, 'rgba(20, 12, 40, 0.95)');
                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, cssW, cssH);

                // Grid overlay (HUD feel)
                ctx.strokeStyle = 'rgba(94, 92, 230, 0.18)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (let gx = 0; gx <= cssW; gx += cssW / 8) {
                    ctx.moveTo(gx + 0.5, 0); ctx.lineTo(gx + 0.5, cssH);
                }
                for (let gy = 0; gy <= cssH; gy += cssH / 5) {
                    ctx.moveTo(0, gy + 0.5); ctx.lineTo(cssW, gy + 0.5);
                }
                ctx.stroke();

                // Baseline glow
                const baseGrad = ctx.createLinearGradient(0, cssH * 0.3, 0, cssH);
                baseGrad.addColorStop(0, 'rgba(10, 132, 255, 0)');
                baseGrad.addColorStop(1, 'rgba(94, 92, 230, 0.25)');
                ctx.fillStyle = baseGrad;
                ctx.fillRect(0, cssH * 0.3, cssW, cssH * 0.7);

                // Compute bar levels
                const totalW = cssW - 16;
                const barW = totalW / NUM_BARS;
                const gap = 2;
                const maxH = cssH * 0.72;
                const cy = cssH * 0.55;

                // Multi-octave envelope: each bar gets a base frequency
                // (left = high freq / bright color, right = low freq / violet)
                const bars = new Array(NUM_BARS);
                for (let i = 0; i < NUM_BARS; i++) {
                    const nx = i / (NUM_BARS - 1); // 0..1 across bars
                    // Speech-like formant envelope: middle bands dominant,
                    // tapering toward the edges — makes the visual feel like
                    // an actual voice spectrum rather than random noise.
                    const formant = Math.exp(-Math.pow((nx - 0.45) * 2.6, 2));
                    if (speaking) {
                        // Three layered sines + slow temporal variation
                        const phase = t * 2.2 + nx * 5;
                        const env = 0.6 + 0.4 * Math.sin(t * 1.7 + nx * 6.2);
                        const a = (Math.sin(phase) * 0.45
                                 + Math.sin(phase * 2.3 + nx) * 0.3
                                 + Math.sin(phase * 4.7 + nx * 2) * 0.2);
                        bars[i] = Math.max(0.08, Math.min(1, ((a + 1) * 0.5 * env) * (0.35 + 0.65 * formant)));
                    } else {
                        // Idle: subtle low-amplitude breathing
                        bars[i] = 0.12 + 0.05 * (0.5 + 0.5 * Math.sin(t * 1.4 + nx * 9));
                    }
                }

                // Draw bars (bottom-up, with vertical gradient pink→violet→blue→cyan)
                for (let i = 0; i < NUM_BARS; i++) {
                    const h = bars[i] * maxH;
                    const x = 8 + i * barW;
                    const y = cy - h / 2;
                    const w = barW - gap;
                    const grad = ctx.createLinearGradient(0, y + h, 0, y);
                    if (speaking) {
                        grad.addColorStop(0.0, '#ff375f');
                        grad.addColorStop(0.45, '#5e5ce6');
                        grad.addColorStop(0.8, '#0a84ff');
                        grad.addColorStop(1.0, '#64d2ff');
                    } else {
                        grad.addColorStop(0.0, 'rgba(94, 92, 230, 0.4)');
                        grad.addColorStop(1.0, 'rgba(100, 210, 255, 0.55)');
                    }
                    ctx.fillStyle = grad;
                    const r = Math.min(w / 2, 2);
                    ctx.beginPath();
                    ctx.moveTo(x + r, y);
                    ctx.lineTo(x + w - r, y);
                    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                    ctx.lineTo(x + w, y + h - r);
                    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                    ctx.lineTo(x + r, y + h);
                    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                    ctx.lineTo(x, y + r);
                    ctx.quadraticCurveTo(x, y, x + r, y);
                    ctx.closePath();
                    ctx.fill();

                    // Glow cap on the top edge for speaking state
                    if (speaking && h > 8) {
                        ctx.shadowColor = '#ff375f';
                        ctx.shadowBlur = 8;
                        ctx.fillStyle = 'rgba(255, 55, 95, 0.0)';
                        ctx.fillRect(x, y - 1, w, 1);
                        ctx.shadowBlur = 0;
                    }
                }

                // Central halo when speaking
                if (speaking) {
                    const haloX = cssW * 0.5 + Math.sin(t * 0.7) * (cssW * 0.18);
                    const halo = ctx.createRadialGradient(haloX, cy, 0, haloX, cy, cssW * 0.35);
                    halo.addColorStop(0, 'rgba(255, 55, 95, 0.35)');
                    halo.addColorStop(0.4, 'rgba(94, 92, 230, 0.18)');
                    halo.addColorStop(1, 'rgba(94, 92, 230, 0)');
                    ctx.fillStyle = halo;
                    ctx.fillRect(0, 0, cssW, cssH);
                }

                // Scanline (only when speaking): a vertical light bar that
                // sweeps left-to-right every 4s and leaves a faint trail.
                if (speaking) {
                    const cycle = 4.0;
                    const phase = (t % cycle) / cycle;
                    const sx = phase * (cssW - 4) + 2;
                    const sgrad = ctx.createLinearGradient(sx - 12, 0, sx + 12, 0);
                    sgrad.addColorStop(0, 'rgba(100, 210, 255, 0)');
                    sgrad.addColorStop(0.5, 'rgba(100, 210, 255, 0.7)');
                    sgrad.addColorStop(1, 'rgba(100, 210, 255, 0)');
                    ctx.fillStyle = sgrad;
                    ctx.fillRect(sx - 12, 0, 24, cssH);
                }

                // Outer border glow when speaking
                ctx.strokeStyle = speaking ? 'rgba(255, 55, 95, 0.4)' : 'rgba(94, 92, 230, 0.25)';
                ctx.lineWidth = 1;
                ctx.strokeRect(0.5, 0.5, cssW - 1, cssH - 1);

                setStatus(speaking ? '● LIVE' : 'STANDBY', speaking);
                rafId = requestAnimationFrame(draw);
            };
            rafId = requestAnimationFrame(draw);
            _spectrograms.push({ cancel: () => rafId && cancelAnimationFrame(rafId) });
        }

        // ===== Mobile Spectrogram: ripple (thinking) + spectrogram (speaking) + idle =====
        const _mobileSpecs = [];
        function startMobileSpectrogram(canvas, stateEl) {
            const ctx = canvas.getContext('2d');
            let rafId = null;
            let t0 = performance.now();
            const NUM_BARS = 24;

            const setState = (s) => {
                if (!stateEl) return;
                stateEl.textContent = s;
                stateEl.className = 'mobile-spec-state ' + (
                    state.isSpeaking ? 'speaking' :
                    state.isListening ? 'listening' :
                    state.assistantActive ? 'thinking' : 'idle'
                );
            };

            const draw = () => {
                const t = (performance.now() - t0) / 1000;
                const speaking = !!state.isSpeaking;
                const listening = !!state.isListening;
                const thinking = !speaking && !listening && !!state.assistantActive;
                const idle = !speaking && !listening && !state.assistantActive;

                const cssW = canvas.clientWidth || 320;
                const cssH = canvas.clientHeight || 180;
                const dpr = window.devicePixelRatio || 1;
                if (canvas.width !== Math.round(cssW * dpr) || canvas.height !== Math.round(cssH * dpr)) {
                    canvas.width = Math.round(cssW * dpr);
                    canvas.height = Math.round(cssH * dpr);
                }
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.clearRect(0, 0, cssW, cssH);

                const cx = cssW / 2, cy = cssH / 2;

                if (speaking) {
                    // ---- TTS spectrogram (pink/violet bars) ----
                    const bg = ctx.createLinearGradient(0, 0, 0, cssH);
                    bg.addColorStop(0, 'rgba(10,8,32,0.97)');
                    bg.addColorStop(1, 'rgba(20,12,40,0.97)');
                    ctx.fillStyle = bg;
                    ctx.fillRect(0, 0, cssW, cssH);

                    // Grid
                    ctx.strokeStyle = 'rgba(94,92,230,0.18)';
                    ctx.lineWidth = 0.5;
                    for (let gx = 0; gx <= cssW; gx += cssW / 6) {
                        ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, cssH); ctx.stroke();
                    }
                    for (let gy = 0; gy <= cssH; gy += cssH / 4) {
                        ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(cssW, gy); ctx.stroke();
                    }

                    const totalW = cssW - 16, barW = totalW / NUM_BARS, gap = 2;
                    const maxH = cssH * 0.65, barCy = cssH * 0.55;
                    for (let i = 0; i < NUM_BARS; i++) {
                        const nx = i / (NUM_BARS - 1);
                        const formant = Math.exp(-Math.pow((nx - 0.45) * 2.6, 2));
                        const env = 0.6 + 0.4 * Math.sin(t * 1.7 + nx * 6.2);
                        const a = (Math.sin(t * 2.2 + nx * 5) * 0.45
                                 + Math.sin(t * 2.2 * 2.3 + nx) * 0.3
                                 + Math.sin(t * 2.2 * 4.7 + nx * 2) * 0.2);
                        const barH = Math.max(0.08, Math.min(1, ((a + 1) * 0.5 * env) * (0.35 + 0.65 * formant))) * maxH;
                        const x = 8 + i * barW, y = barCy - barH / 2, w = barW - gap;
                        const grad = ctx.createLinearGradient(0, y + barH, 0, y);
                        grad.addColorStop(0, '#ff375f');
                        grad.addColorStop(0.45, '#5e5ce6');
                        grad.addColorStop(0.8, '#0a84ff');
                        grad.addColorStop(1, '#64d2ff');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.roundRect(x, y, w, barH, 2);
                        ctx.fill();
                    }
                    // Halo
                    const haloX = cssW * 0.5 + Math.sin(t * 0.7) * (cssW * 0.15);
                    const halo = ctx.createRadialGradient(haloX, barCy, 0, haloX, barCy, cssW * 0.3);
                    halo.addColorStop(0, 'rgba(255,55,95,0.3)');
                    halo.addColorStop(1, 'rgba(94,92,230,0)');
                    ctx.fillStyle = halo;
                    ctx.fillRect(0, 0, cssW, cssH);
                    // Scanline
                    const phase = ((t % 4) / 4) * (cssW - 4) + 2;
                    const sgrad = ctx.createLinearGradient(phase - 10, 0, phase + 10, 0);
                    sgrad.addColorStop(0, 'rgba(100,210,255,0)');
                    sgrad.addColorStop(0.5, 'rgba(100,210,255,0.65)');
                    sgrad.addColorStop(1, 'rgba(100,210,255,0)');
                    ctx.fillStyle = sgrad;
                    ctx.fillRect(phase - 10, 0, 20, cssH);

                } else if (thinking) {
                    // ---- Ripple / water wave effect (thinking) ----
                    const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, cssW * 0.7);
                    bg.addColorStop(0, 'rgba(50,30,80,0.97)');
                    bg.addColorStop(1, 'rgba(10,8,32,0.97)');
                    ctx.fillStyle = bg;
                    ctx.fillRect(0, 0, cssW, cssH);

                    // 4 expanding ripple rings
                    for (let r = 0; r < 4; r++) {
                        const phase = ((t * 0.7 + r * 0.5) % 2) / 2;
                        const radius = phase * cssW * 0.55;
                        const alpha = (1 - phase) * 0.5;
                        ctx.strokeStyle = `rgba(191,90,242,${alpha})`;
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                    // Central glow
                    const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, cssW * 0.2);
                    cg.addColorStop(0, 'rgba(191,90,242,0.3)');
                    cg.addColorStop(1, 'rgba(191,90,242,0)');
                    ctx.fillStyle = cg;
                    ctx.fillRect(0, 0, cssW, cssH);
                    // Center dot
                    ctx.fillStyle = 'rgba(191,90,242,0.7)';
                    ctx.beginPath();
                    ctx.arc(cx, cy, 3, 0, Math.PI * 2);
                    ctx.fill();

                } else if (listening) {
                    // ---- Listening: blue ripple ----
                    const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, cssW * 0.7);
                    bg.addColorStop(0, 'rgba(10,50,80,0.97)');
                    bg.addColorStop(1, 'rgba(10,8,32,0.97)');
                    ctx.fillStyle = bg;
                    ctx.fillRect(0, 0, cssW, cssH);

                    for (let r = 0; r < 4; r++) {
                        const phase = ((t * 0.9 + r * 0.5) % 2) / 2;
                        const radius = phase * cssW * 0.5;
                        const alpha = (1 - phase) * 0.45;
                        ctx.strokeStyle = `rgba(10,132,255,${alpha})`;
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                    const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, cssW * 0.18);
                    cg.addColorStop(0, 'rgba(10,132,255,0.35)');
                    cg.addColorStop(1, 'rgba(10,132,255,0)');
                    ctx.fillStyle = cg;
                    ctx.fillRect(0, 0, cssW, cssH);

                } else {
                    // ---- Idle: gentle breathing ----
                    const breathe = 0.5 + 0.5 * Math.sin(t * 1.2);
                    const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, cssW * 0.6);
                    bg.addColorStop(0, `rgba(${Math.round(20+breathe*15)},${Math.round(8+breathe*10)},${Math.round(50+breathe*20)},0.97)`);
                    bg.addColorStop(1, 'rgba(10,8,32,0.97)');
                    ctx.fillStyle = bg;
                    ctx.fillRect(0, 0, cssW, cssH);

                    // Subtle grid
                    ctx.strokeStyle = 'rgba(94,92,230,0.12)';
                    ctx.lineWidth = 0.5;
                    for (let gx = 0; gx <= cssW; gx += cssW / 6) {
                        ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, cssH); ctx.stroke();
                    }
                    for (let gy = 0; gy <= cssH; gy += cssH / 4) {
                        ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(cssW, gy); ctx.stroke();
                    }
                    // Slow pulse circle
                    const pulseR = cssW * 0.15 + breathe * cssW * 0.08;
                    const pg = ctx.createRadialGradient(cx, cy, 0, cx, cy, pulseR);
                    pg.addColorStop(0, `rgba(100,210,255,${0.15+breathe*0.1})`);
                    pg.addColorStop(1, 'rgba(100,210,255,0)');
                    ctx.fillStyle = pg;
                    ctx.fillRect(0, 0, cssW, cssH);
                }

                setState('');
                rafId = requestAnimationFrame(draw);
            };
            rafId = requestAnimationFrame(draw);
            _mobileSpecs.push({ cancel: () => rafId && cancelAnimationFrame(rafId) });
        }

        // ===== Mobile Voice Widget =====
        function initMobileVoiceWidget(widget) {
            const micBtn = widget.querySelector('[data-role="mic-btn"]');
            const ripple = widget.querySelector('[data-role="ripple"]');
            const actions = widget.querySelector('[data-role="v-actions"]');
            const hint = widget.querySelector('[data-role="v-hint"]');
            const bubble = widget.querySelector('[data-role="v-bubble"]');
            const sendBtn = widget.querySelector('[data-role="v-send"]');
            const cancelBtn = widget.querySelector('[data-role="v-cancel"]');

            let recordedText = '';
            let _recording = false;
            let _waitingResponse = false;

            function setListening(on) {
                _recording = on;
                if (on) _waitingResponse = false;
                micBtn.classList.toggle('recording', on);
                ripple.style.display = on ? 'block' : 'none';
                hint.style.display = on ? 'none' : 'block';
                hint.textContent = on ? '点击结束' : '点击开始说话';
                actions.style.display = 'none';
                bubble.style.display = 'none';
                bubble.textContent = '';
                if (on) {
                    if (state.isListening) stopListening();
                    startListening();
                } else {
                    stopListening();
                }
            }

            function showResult(text) {
                recordedText = text;
                bubble.textContent = text || '(未识别到内容)';
                bubble.className = 'mobile-voice-bubble' + (text ? ' listening' : ' error');
                bubble.style.display = 'block';
                actions.style.display = 'flex';
                hint.style.display = 'none';
            }

            micBtn.addEventListener('click', () => {
                if (!_recording) {
                    setListening(true);
                } else {
                    setListening(false);
                    const text = (state.voiceBase || '') + (state.voiceFinals || '');
                    showResult(text.trim());
                }
            });

            sendBtn.addEventListener('click', () => {
                if (!recordedText) return;
                const text = recordedText;
                actions.style.display = 'none';
                bubble.style.display = 'none';
                hint.style.display = 'block';
                hint.textContent = '等待回复...';
                recordedText = '';
                _waitingResponse = true;
                // Send via WebSocket
                if (state.ws?.readyState === WebSocket.OPEN) {
                    state.ws.send(JSON.stringify({ type: 'user_input', text }));
                }
            });

            cancelBtn.addEventListener('click', () => {
                actions.style.display = 'none';
                bubble.style.display = 'none';
                hint.style.display = 'block';
                hint.textContent = '点击开始说话';
                recordedText = '';
                _waitingResponse = false;
                state.voiceBase = '';
                state.voiceFinals = '';
            });

            // When thinking starts (assistantActive becomes true)
            const stopThinkingObserver = setInterval(() => {
                if (state.assistantActive && !state.isListening && !state.isSpeaking && _waitingResponse) {
                    bubble.textContent = '思考中...';
                    bubble.className = 'mobile-voice-bubble thinking';
                    bubble.style.display = 'block';
                    hint.style.display = 'none';
                } else if (!state.assistantActive && _waitingResponse) {
                    // Generation done, stop showing thinking, wait for speaking to start
                    _waitingResponse = false;
                    bubble.style.display = 'none';
                    hint.style.display = 'block';
                    hint.textContent = '点击开始说话';
                }
            }, 200);

            widget._stopThinkingObserver = () => clearInterval(stopThinkingObserver);
        }

        async function _startWhisperListening() {
            // Check if model is ready
            try {
                const res = await fetch('/api/asr/status');
                const data = await res.json();
                if (!data.ready) {
                    const statusText = document.getElementById('voice-status-text');
                    if (statusText) statusText.textContent = 'ASR 模型加载中...';
                    return;
                }
            } catch (e) {
                const statusText = document.getElementById('voice-status-text');
                if (statusText) statusText.textContent = 'ASR 连接失败';
                return;
            }

            state.isListening = true;
            state.voiceBase = '';
            state.voiceFinals = '';
            const inp = document.getElementById('user-input');
            if (inp) inp.value = '';
            const statusText = document.getElementById('voice-status-text');
            if (statusText) statusText.textContent = '正在聆听...';
            setListeningVisual(true);
            setAgentStatus('listening');
            stopTts();

            try {
                await startWhisperRecording();
            } catch (e) {
                state.isListening = false;
                setListeningVisual(false);
                if (statusText) statusText.textContent = '麦克风权限被拒绝';
            }
        }

        async function _stopWhisperListening() {
            await stopWhisperRecording();
            const statusText = document.getElementById('voice-status-text');
            if (statusText) statusText.textContent = '正在识别...';
            const text = await transcribeWhisper();
            state.voiceBase = text;
            state.voiceFinals = text;
            const inp = document.getElementById('user-input');
            if (inp) inp.value = text;
            const t = document.getElementById('voice-transcript');
            if (t) t.textContent = text;
            if (statusText) statusText.textContent = text ? '识别完成' : '未识别到内容';
            state.isListening = false;
            setListeningVisual(false);
            if (state.isSpeaking) setAgentStatus('speaking');
            else if (state.assistantActive) setAgentStatus('thinking');
            else setAgentStatus('idle');
        }

        function startListening() {
            if (state.isListening) return;
            if (state.asrProvider === 'whisper') {
                _startWhisperListening();
                return;
            }
            if (!state.recognition) state.recognition = initBrowserAsr();
            if (!state.recognition) {
                const statusText = document.getElementById('voice-status-text');
                if (statusText) statusText.textContent = '当前浏览器不支持语音识别';
                console.warn('SpeechRecognition API not available');
                return;
            }
            state.isListening = true;
            setListeningVisual(true);
            setAgentStatus('listening');
            _startWaveforms();
            // Barge-in: the AI yields its voice to the user (stops, not pauses).
            stopTts();

            // Recognized text lands in the message box: live interim results are
            // shown as they arrive, finals accumulate, and the user sends manually.
            // A new voice round starts fresh — clear the box so the previous
            // round's text isn't merged into this one.
            const inp = document.getElementById('user-input');
            if (inp) inp.value = '';
            state.voiceBase = '';
            state.voiceFinals = '';

            const statusText = document.getElementById('voice-status-text');
            if (statusText) statusText.textContent = '正在聆听...';

            const recognition = state.recognition;
            const mobileBubble = document.querySelector('.mobile-voice-bubble');
            recognition.onresult = (e) => {
                let interim = '';
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    const t = e.results[i][0].transcript;
                    if (e.results[i].isFinal) state.voiceFinals += t;
                    else interim += t;
                }
                const shown = state.voiceBase + state.voiceFinals + interim;
                const t = document.getElementById('voice-transcript');
                if (t) t.textContent = shown;
                const box = document.getElementById('user-input');
                if (box) box.value = shown;
                if (mobileBubble) {
                    mobileBubble.textContent = shown;
                    mobileBubble.style.display = shown ? 'block' : 'none';
                }
            };
            recognition.onend = () => {
                if (!state.isListening) return;
                setTimeout(() => {
                    if (!state.isListening) return;
                    try { recognition.start(); } catch (e) {}
                }, 250);
            };
            recognition.onerror = (e) => {
                if (e.error === 'no-speech' || e.error === 'aborted') return;
                console.error('ASR error:', e);
                const st = document.getElementById('voice-status-text');
                if (st) st.textContent = '识别失败: ' + (e.error || 'unknown');
                stopListening();
            };
            try {
                recognition.start();
            } catch (e) {
                console.error('recognition.start failed', e);
                stopListening();
            }
        }

        function stopListening(send = false) {
            const wasListening = state.isListening;
            if (state.asrProvider === 'whisper') {
                state.isListening = false;
                setListeningVisual(false);
                _stopWaveforms();
                if (wasListening) _stopWhisperListening();
                return;
            }
            state.isListening = false;
            setListeningVisual(false);
            const statusText = document.getElementById('voice-status-text');
            if (statusText) statusText.textContent = '点击开始说话';
            _stopWaveforms();
            if (state.recognition) {
                try {
                    state.recognition.onend = null;
                    state.recognition.onerror = null;
                    state.recognition.onresult = null;
                    state.recognition.stop();
                } catch (e) {}
            }
            if (wasListening && !state.isSpeaking) setAgentStatus('idle');
            // Second tap on the mic: recognition is done — send what's in the box.
            if (send) {
                const box = document.getElementById('user-input');
                if (box && box.value.trim()) {
                    const btn = document.getElementById('send-btn');
                    if (btn) btn.click();
                }
            }
        }

        // WebSocket
        function connect() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            state.ws = new WebSocket(`${protocol}//${location.host}/ws`);

            state.ws.onopen = () => {
                setConnectionStatus(true);
                const inp = document.getElementById('user-input');
                const vbtn = document.getElementById('voice-btn');
                const sbtn = document.getElementById('send-btn');
                if (inp) inp.disabled = false;
                if (vbtn) vbtn.disabled = false;
                if (sbtn) sbtn.disabled = false;
                state.ws.send(JSON.stringify({ type: 'start' }));
            };

            state.ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg.type === 'assistant_text_delta') appendAssistantText(msg.delta);
                else if (msg.type === 'tts_audio') _queueTtsAudio(msg.audio, msg.chunk_index);
                else if (msg.type === 'generation_complete') {
                    // Queue everything not yet spoken as ONE utterance: the browser
                    // synthesizes and plays it continuously (no per-utterance start
                    // latency gaps), so the tail plays back linearly.
                    const rest = state.currentText.slice(state.lastSpokenLength);
                    if (rest.trim().length > 0) {
                        state.lastSpokenLength = state.currentText.length;
                        if (state.isListening) {
                            // Mic still open — the turn is being barged in; the
                            // tail is stale once the user sends, so drop it.
                        } else if (state.isSpeaking) {
                            // Current utterance still playing — it picks this up on end.
                            state.pendingTail = rest;
                        } else {
                            speakText(rest);
                        }
                    }
                    finalizeAssistantMessage();
                    const inp = document.getElementById('user-input');
                    const vbtn = document.getElementById('voice-btn');
                    const sbtn = document.getElementById('send-btn');
                    if (inp) inp.disabled = false;
                    if (vbtn) vbtn.disabled = false;
                    if (sbtn) sbtn.disabled = false;
                }
            };

            state.ws.onclose = () => {
                setConnectionStatus(false);
                const inp = document.getElementById('user-input');
                const vbtn = document.getElementById('voice-btn');
                const sbtn = document.getElementById('send-btn');
                if (inp) inp.disabled = true;
                if (vbtn) vbtn.disabled = true;
                if (sbtn) sbtn.disabled = true;
                setAgentStatus('idle');
            };
        }

        // Layout Save/Load (versioned to auto-invalidate stale layouts)
        const LAYOUT_VERSION = 'v4';

        function saveLayout() {
            const widgets = [];
            document.querySelectorAll('.widget').forEach(w => {
                widgets.push({
                    type: w.dataset.type,
                    x: parseFloat(w.style.left),
                    y: parseFloat(w.style.top),
                    w: w.offsetWidth,
                    h: w.offsetHeight
                });
            });
            localStorage.setItem('voice-shell-layout', JSON.stringify({ version: LAYOUT_VERSION, widgets }));
        }

        function loadLayout() {
            const saved = localStorage.getItem('voice-shell-layout');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    if (data && data.version === LAYOUT_VERSION && Array.isArray(data.widgets)) {
                        data.widgets.forEach(item => {
                            createWidget(item.type, item.x, item.y, item.w, item.h);
                        });
                        return true;
                    }
                } catch (e) {}
            }
            return false;
        }

        function getDefaultLayout() {
            const w = canvas.clientWidth;
            const h = canvas.clientHeight;
            if (w < 640) {
                const aw = Math.min(200, w - 100);
                const ax = Math.round((w - aw) / 2);
                const ah = Math.round(aw * 2.3);
                const iw = Math.min(370, w - 20);
                const ix = Math.round((w - iw) / 2);
                return [
                    { type: 'avatar', x: ax, y: 4, w: aw, h: ah },
                    { type: 'messages', x: 12, y: ah + 16, w: w - 24, h: h - ah - 110 },
                    { type: 'input', x: ix, y: h - 82, w: iw, h: 68 }
                ];
            }
            const colW = Math.min(600, Math.max(420, Math.round(w * 0.48)));
            const cx = Math.round((w - colW) / 2);
            return [
                { type: 'status', x: w - 210, y: 16, w: 194, h: 195 },
                { type: 'providers', x: 16, y: 16, w: 200, h: 300 },
                { type: 'avatar', x: cx + Math.round(colW / 2) - 150, y: 28, w: 300, h: 340 },
                { type: 'messages', x: cx, y: 380, w: colW, h: Math.max(180, h - 483) },
                { type: 'input', x: cx, y: h - 88, w: colW, h: 70 }
            ];
        }

        function applyDefaultLayout() {
            const layout = getDefaultLayout();
            layout.forEach(item => {
                createWidget(item.type, item.x, item.y, item.w, item.h);
            });
        }

        function getMobileLayout() {
            const w = canvas.clientWidth;
            const h = canvas.clientHeight;
            // mobile: full-width spectrogram at top, large voice at bottom
            const specW = Math.min(360, w - 20);
            const specH = Math.round(specW * 0.55);
            const specX = Math.round((w - specW) / 2);
            const voiceW = Math.min(260, w - 20);
            const voiceH = 200;
            const voiceX = Math.round((w - voiceW) / 2);
            return [
                { type: 'mobile-spectrogram', x: specX, y: 8, w: specW, h: specH },
                { type: 'mobile-voice', x: voiceX, y: h - voiceH - 8, w: voiceW, h: voiceH }
            ];
        }

        function applyMobileLayout() {
            getMobileLayout().forEach(item => {
                createWidget(item.type, item.x, item.y, item.w, item.h);
            });
        }

        // Init
        function init() {
            if (!loadLayout()) {
                requestAnimationFrame(() => {
                    applyDefaultLayout();
                    saveLayout();
                });
            }

            btnEdit.addEventListener('click', () => toggleEditMode(true));
            btnSave.addEventListener('click', () => {
                toggleEditMode(false);
                saveLayout();
            });
            btnReset.addEventListener('click', () => {
                if (confirm('重置为默认布局？')) {
                    localStorage.removeItem('voice-shell-layout');
                    document.querySelectorAll('.widget').forEach(w => w.remove());
                    requestAnimationFrame(() => {
                        applyDefaultLayout();
                        saveLayout();
                    });
                }
            });

            const btnMobileReset = $('btn-mobile-reset');
            if (btnMobileReset) {
                btnMobileReset.addEventListener('click', () => {
                    if (confirm('切换到移动端布局？')) {
                        localStorage.removeItem('voice-shell-layout');
                        document.querySelectorAll('.widget').forEach(w => w.remove());
                        requestAnimationFrame(() => {
                            applyMobileLayout();
                            saveLayout();
                        });
                    }
                });
            }

            // Settings modal
            const settingsOverlay = $('settings-overlay');
            const settingsToast = $('set-toast');
            let toastTimer = null;
            function showSettingsToast(msg, isError) {
                settingsToast.textContent = msg;
                settingsToast.classList.toggle('error', !!isError);
                settingsToast.classList.add('show');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => settingsToast.classList.remove('show'), 2200);
            }
            function openSettings() {
                settingsOverlay.classList.add('open');
                settingsToast.classList.remove('show');
                fetch('/api/settings').then(r => r.json()).then(d => {
                    $('set-base-url').value = d.baseUrl || '';
                    $('set-api-key').value = d.apiKey || '';
                    $('set-model').value = d.model || '';
                }).catch(() => {});
            }
            function closeSettings() { settingsOverlay.classList.remove('open'); }
            $('btn-settings').addEventListener('click', openSettings);
            $('set-cancel').addEventListener('click', closeSettings);
            settingsOverlay.addEventListener('click', e => {
                if (e.target === settingsOverlay) closeSettings();
            });
            $('set-save').addEventListener('click', () => {
                const body = {
                    baseUrl: $('set-base-url').value.trim(),
                    apiKey: $('set-api-key').value.trim(),
                    model: $('set-model').value.trim(),
                };
                fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                }).then(r => {
                    if (!r.ok) throw new Error('save failed');
                    showSettingsToast('已保存，下一条消息生效');
                }).catch(() => showSettingsToast('保存失败，请重试', true));
            });
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && settingsOverlay.classList.contains('open')) closeSettings();
            });

            // Library items
            document.querySelectorAll('.library-item').forEach(item => {
                item.addEventListener('click', () => {
                    if (!state.isEditMode) return;
                    const type = item.dataset.type;
                    const template = widgetTemplates[type];
                    if (template) {
                        createWidget(type, 50, 50, template.defaultW, template.defaultH);
                    }
                });
            });

            // Preload browser TTS voices (getVoices() is empty until voiceschanged on some browsers).
            if (window.speechSynthesis) {
                window.speechSynthesis.getVoices();
                window.speechSynthesis.onvoiceschanged = () => {
                    window.speechSynthesis.getVoices();
                    refreshTtsVoiceSelect();
                };
            }
            refreshTtsVoiceSelect();

            // 页面加载时检查本地 TTS 就绪状态
            fetch('/api/tts/status').then(r => r.json()).then(data => {
                const el = document.getElementById('sherpa-tts-status');
                if (!el) return;
                if (data.ready) {
                    el.textContent = '在线';
                    el.className = 'provider-status supported';
                } else {
                    el.textContent = '离线';
                    el.className = 'provider-status';
                }
            }).catch(() => {});

            setAgentStatus('idle');
            connect();
            injectAvatarStyles();
            loadAvatarList();

            // Close avatar menu on outside click
            document.addEventListener('click', () => {
                document.querySelectorAll('.avatar-menu.open').forEach(m => m.classList.remove('open'));
            });
        }

        init();
    </script>
</body>
</html>
