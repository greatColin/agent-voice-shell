<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Voice Shell</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            /* Apple system colors (dark) */
            --blue: #0a84ff;
            --indigo: #5e5ce6;
            --cyan: #64d2ff;
            --pink: #ff375f;

            /* Liquid glass */
            --glass: rgba(255, 255, 255, 0.055);
            --glass-strong: rgba(255, 255, 255, 0.09);
            --glass-hi: rgba(255, 255, 255, 0.13);
            --border: rgba(255, 255, 255, 0.1);
            --border-strong: rgba(255, 255, 255, 0.18);
            --hairline: rgba(255, 255, 255, 0.07);

            /* Text */
            --t1: #f5f5f7;
            --t2: rgba(245, 245, 247, 0.62);
            --t3: rgba(245, 245, 247, 0.35);

            --danger: #ff453a;
            --ok: #30d158;
            --warn: #ff9f0a;

            --r-lg: 26px;
            --r-md: 18px;
            --r-sm: 12px;
            --shadow: 0 16px 48px rgba(0, 0, 0, 0.42), 0 2px 8px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.09);
            --grad: linear-gradient(135deg, var(--blue), var(--indigo));
            /* legacy aliases */
            --c1: #64d2ff;
            --c2: #5e5ce6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #040406;
            color: var(--t1);
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        /* Ambient light blobs */
        .ambient {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .ambient::before,
        .ambient::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(110px);
        }
        .ambient::before {
            width: 56vw; height: 56vw;
            left: -14vw; top: -22vw;
            background: radial-gradient(circle, rgba(94, 92, 230, 0.20), transparent 68%);
        }
        .ambient::after {
            width: 50vw; height: 50vw;
            right: -12vw; bottom: -20vw;
            background: radial-gradient(circle, rgba(100, 210, 255, 0.13), transparent 68%);
        }
        .ambient .blob-center {
            position: absolute;
            width: 40vw; height: 34vw;
            left: 50%; top: 46%;
            transform: translate(-50%, -50%);
            background: radial-gradient(ellipse, rgba(10, 132, 255, 0.10), transparent 65%);
            filter: blur(90px);
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 1440px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ===== Header ===== */
        #header {
            height: 60px;
            padding: 0 22px;
            display: flex;
            align-items: center;
            gap: 16px;
            background: transparent;
            z-index: 100;
            flex-shrink: 0;
        }
        .logo { display: flex; align-items: center; gap: 11px; }
        .logo-icon {
            width: 32px; height: 32px;
            background: var(--grad);
            border-radius: 9.5px;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 800; color: #fff;
            box-shadow: 0 4px 16px rgba(10, 132, 255, 0.35), inset 0 1px 0 rgba(255,255,255,0.25);
        }
        .logo-text { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; color: var(--t1); white-space: nowrap; }

        .header-actions { display: flex; gap: 8px; margin-left: auto; }
        .hdr-btn {
            height: 34px; padding: 0 14px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--glass);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            color: var(--t2);
            font-size: 12.5px; font-weight: 500;
            cursor: pointer;
            display: flex; align-items: center; gap: 6px;
            white-space: nowrap;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.07);
            transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        .hdr-btn svg { width: 14px; height: 14px; }
        .hdr-btn:hover { background: var(--glass-strong); color: var(--t1); border-color: var(--border-strong); transform: translateY(-1px); }
        .hdr-btn:active { transform: translateY(0) scale(0.97); }
        .hdr-btn.edit.active, .hdr-btn.edit:hover { border-color: transparent; background: var(--grad); color: #fff; }
        .hdr-btn.save { background: var(--grad); border-color: transparent; color: #fff; font-weight: 600; box-shadow: 0 4px 16px rgba(10, 132, 255, 0.4); }
        .hdr-btn.reset:hover { color: var(--danger); border-color: rgba(255, 69, 58, 0.4); }
        .hdr-btn.mobile-reset { font-size: 11px; padding: 0 8px; }
        .hdr-btn.mobile-reset:hover { border-color: rgba(100, 210, 255, 0.5); color: var(--blue); }

        .conn-badge {
            display: flex; align-items: center; gap: 7px;
            height: 34px; padding: 0 14px;
            background: var(--glass);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 11.5px; font-weight: 500; color: var(--t2);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.07);
        }
        .conn-badge .dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--danger); box-shadow: 0 0 8px var(--danger);
        }
        .conn-badge.connected .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: pulse-dot 2s infinite; }
        @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.4} }

        /* ===== Canvas ===== */
        #canvas {
            flex: 1;
            position: relative;
            padding: 14px;
            overflow: hidden;
        }

        /* ===== Settings Modal ===== */
        #settings-overlay {
            position: fixed; inset: 0; z-index: 2000;
            display: none;
            align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        #settings-overlay.open { display: flex; animation: settings-fade 0.18s ease-out; }
        @keyframes settings-fade { from { opacity: 0; } to { opacity: 1; } }
        .settings-card {
            width: min(440px, calc(100vw - 36px));
            background: rgba(28, 28, 32, 0.82);
            backdrop-filter: blur(48px) saturate(180%);
            -webkit-backdrop-filter: blur(48px) saturate(180%);
            border: 1px solid var(--border-strong);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 32px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
            animation: settings-pop 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes settings-pop { from { opacity: 0; transform: scale(0.94) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .settings-title { font-size: 17px; font-weight: 700; color: var(--t1); letter-spacing: -0.02em; }
        .settings-sub { font-size: 12px; color: var(--t3); margin-top: 5px; line-height: 1.5; }
        .settings-fields { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; }
        .settings-field label {
            display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
            text-transform: uppercase; color: var(--t3); margin-bottom: 7px;
        }
        .settings-field input {
            width: 100%; height: 42px; padding: 0 14px;
            background: var(--glass);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--t1); font-size: 13.5px; font-family: inherit;
            outline: none;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }
        .settings-field input::placeholder { color: var(--t3); opacity: 0.65; }
        .settings-field input:focus { border-color: var(--blue); box-shadow: 0 0 0 3.5px rgba(10, 132, 255, 0.22); }
        .settings-actions { display: flex; gap: 10px; margin-top: 22px; }
        .settings-btn {
            flex: 1; height: 42px;
            border-radius: 12px; border: 1px solid var(--border);
            background: var(--glass); color: var(--t2);
            font-size: 13.5px; font-weight: 600; font-family: inherit;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.07);
            transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        .settings-btn:hover { background: var(--glass-strong); color: var(--t1); }
        .settings-btn.primary {
            border: none; background: var(--grad); color: #fff;
            box-shadow: 0 6px 20px rgba(10, 132, 255, 0.42);
        }
        .settings-btn.primary:hover { filter: brightness(1.12); transform: translateY(-1px); }
        .settings-btn.primary:active, .settings-btn:active { transform: scale(0.98); }
        .settings-toast {
            margin-top: 14px; padding: 9px 12px;
            border-radius: 10px; font-size: 12px; font-weight: 500;
            background: rgba(48, 209, 88, 0.14); color: var(--ok);
            border: 1px solid rgba(48, 209, 88, 0.3);
            display: none; text-align: center;
        }
        .settings-toast.show { display: block; animation: settings-fade 0.2s; }
        .settings-toast.error { background: rgba(255, 69, 58, 0.14); color: var(--danger); border-color: rgba(255, 69, 58, 0.3); }

        /* ===== Widget ===== */
        .widget {
            position: absolute;
            background: var(--glass);
            backdrop-filter: blur(36px) saturate(170%);
            -webkit-backdrop-filter: blur(36px) saturate(170%);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
            min-width: 90px;
            min-height: 70px;
        }
        .widget.editing {
            border: 1.5px dashed rgba(10, 132, 255, 0.6);
            cursor: move;
        }
        .widget.editing:hover { box-shadow: 0 20px 56px rgba(0,0,0,0.5), 0 0 0 4px rgba(10,132,255,0.12); }
        .widget.dragging {
            box-shadow: 0 32px 72px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.12);
            background: var(--glass-strong);
            z-index: 1000; opacity: 0.96;
            transition: none;
        }

        .widget-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 9px;
            border-bottom: 1px solid var(--hairline);
            flex-shrink: 0;
        }
        .widget-title {
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--t3);
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .widget-title::before {
            content: '';
            width: 5px; height: 5px; border-radius: 50%;
            background: var(--t3);
        }

        .widget-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.2s; }
        .widget.editing:hover .widget-actions { opacity: 1; }
        .widget-btn {
            width: 22px; height: 22px;
            border: 1px solid var(--border);
            border-radius: 50%;
            cursor: pointer;
            font-size: 10px;
            display: flex; align-items: center; justify-content: center;
            background: var(--glass-strong);
            color: var(--t3);
            transition: all 0.18s;
        }
        .widget-btn:hover { background: var(--danger); border-color: transparent; color: #fff; }

        .widget-content {
            flex: 1;
            min-height: 0;
            overflow: auto;
        }

        .resize-handle {
            position: absolute;
            bottom: 2px; right: 2px;
            width: 16px; height: 16px;
            cursor: se-resize;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .widget.editing:hover .resize-handle,
        .widget.resizing .resize-handle { opacity: 1; }
        .resize-handle::before {
            content: '';
            position: absolute;
            right: 4px; bottom: 4px;
            width: 8px; height: 8px;
            border-right: 2px solid rgba(10, 132, 255, 0.7);
            border-bottom: 2px solid rgba(10, 132, 255, 0.7);
            border-radius: 0 0 3px 0;
        }

        /* Input / Voice / Avatar widgets: hide header unless editing */
        .widget[data-type="input"] .widget-header,
        .widget[data-type="voice"] .widget-header,
        .widget[data-type="avatar"] .widget-header,
        .widget[data-type="spectrogram"] .widget-header { display: none; }
        .widget.editing .widget-header { display: flex !important; }
        .widget[data-type="input"] { padding: 10px 16px; }
        .widget[data-type="voice"] { padding: 10px; }
        /* Spectrogram widget: full-bleed canvas, no chrome — header is hidden,
           padding collapsed to 0, content fills the whole box so the canvas
           stays exactly defaultW × defaultH. */
        .widget[data-type="spectrogram"] { padding: 0; }
        .widget[data-type="spectrogram"] .widget-content { flex: 1; min-height: 0; overflow: hidden; }
        /* Spectrogram widget: fixed canvas area, no user resize handle */
        .widget[data-type="spectrogram"]:not(.editing):not(.dragging) .resize-handle { display: none; }

        /* ===== Avatar ===== */
        .widget[data-type="avatar"]:not(.editing):not(.dragging) {
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border-color: transparent;
            box-shadow: none;
        }
        .widget[data-type="input"]:not(.editing):not(.dragging),
        .widget[data-type="voice"]:not(.editing):not(.dragging) {
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border-color: transparent;
            box-shadow: none;
        }
        .widget-avatar {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 8px; flex: 1;
        }
        .avatar-container {
            position: relative;
            width: 100%;
            max-width: 230px;
            aspect-ratio: 192/208;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
        }
        .avatar-glow {
            position: absolute;
            inset: -4%;
            background: radial-gradient(ellipse at center,
                rgba(94, 92, 230, 0.6) 0%,
                rgba(10, 132, 255, 0.28) 36%,
                transparent 60%);
            z-index: 0;
            pointer-events: none;
            animation: glow-breathe 5s ease-in-out infinite;
            transition: opacity 0.6s;
        }
        @keyframes glow-breathe {
            0%, 100% { opacity: 0.85; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.06); }
        }
        .avatar-ring { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; }
        .avatar-ring.idle::after {
            content: '';
            position: absolute; inset: -8px; border-radius: 50%;
            background: radial-gradient(circle, rgba(148,163,184,0.14), transparent 65%);
        }
        .avatar-ring.listening::after,
        .avatar-ring.thinking::after,
        .avatar-ring.speaking::after {
            content: '';
            position: absolute; inset: -10px; border-radius: 50%;
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
            animation: spin 2.6s linear infinite;
        }
        .avatar-ring.listening::after { background: conic-gradient(from 0deg, transparent 0%, var(--cyan) 18%, transparent 36%); }
        .avatar-ring.thinking::after { background: conic-gradient(from 0deg, transparent 0%, var(--indigo) 18%, transparent 36%); animation-duration: 1.8s; }
        .avatar-ring.speaking::after {
            background: conic-gradient(from 0deg, transparent 0%, var(--pink) 20%, var(--blue) 40%, transparent 55%);
            animation-duration: 1.2s;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .avatar-spritesheet {
            width: 192px;
            height: 208px;
            background-image: var(--avatar-sheet, none);
            background-size: 1536px 832px;
            background-repeat: no-repeat;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            transform: scale(var(--avatar-scale, 1));
            transform-origin: center;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }
        .avatar-spritesheet.idle { background-position: 0 0; }
        .avatar-spritesheet.listening { background-position: 0 -208px; animation: spritesheet-listening 0.8s step-end infinite; }
        .avatar-spritesheet.thinking { background-position: 0 -416px; animation: spritesheet-thinking 1.2s step-end infinite; }
        .avatar-spritesheet.speaking { background-position: 0 -624px; animation: spritesheet-speaking 0.6s step-end infinite; }
        @keyframes spritesheet-listening {
            0% { background-position: 0 -208px; }
            12.5% { background-position: -192px -208px; }
            25% { background-position: -384px -208px; }
            37.5% { background-position: -576px -208px; }
            50% { background-position: -768px -208px; }
            62.5% { background-position: -960px -208px; }
            75% { background-position: -1152px -208px; }
            87.5% { background-position: -1344px -208px; }
        }
        @keyframes spritesheet-thinking {
            0% { background-position: 0 -416px; }
            12.5% { background-position: -192px -416px; }
            25% { background-position: -384px -416px; }
            37.5% { background-position: -576px -416px; }
            50% { background-position: -768px -416px; }
            62.5% { background-position: -960px -416px; }
            75% { background-position: -1152px -416px; }
            87.5% { background-position: -1344px -416px; }
        }
        @keyframes spritesheet-speaking {
            0% { background-position: 0 -624px; }
            12.5% { background-position: -192px -624px; }
            25% { background-position: -384px -624px; }
            37.5% { background-position: -576px -624px; }
            50% { background-position: -768px -624px; }
            62.5% { background-position: -960px -624px; }
            75% { background-position: -1152px -624px; }
            87.5% { background-position: -1344px -624px; }
        }

        .avatar-status {
            padding: 5px 15px;
            border-radius: 999px;
            font-size: 11px; font-weight: 600;
            letter-spacing: 0.03em;
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            color: var(--t2);
            border: 1px solid var(--border);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .avatar-status.listening { background: rgba(48, 209, 88, 0.14); color: var(--ok); border-color: rgba(48, 209, 88, 0.32); }
        .avatar-status.thinking { background: rgba(94, 92, 230, 0.16); color: #a5a3ff; border-color: rgba(94, 92, 230, 0.35); }
        .avatar-status.speaking { background: rgba(255, 55, 95, 0.13); color: #ff6482; border-color: rgba(255, 55, 95, 0.32); }

        .avatar-wave {
            display: flex; align-items: center; justify-content: center;
            gap: 3px; height: 16px;
        }
        .avatar-wave.hidden { display: none; }
        .wave-bar {
            width: 3.5px; border-radius: 3px;
            background: linear-gradient(180deg, var(--cyan), var(--blue));
            box-shadow: 0 0 6px rgba(100, 210, 255, 0.5);
            animation: wave 1s ease-in-out infinite;
        }
        .wave-bar:nth-child(1){animation-delay:0s} .wave-bar:nth-child(2){animation-delay:0.1s}
        .wave-bar:nth-child(3){animation-delay:0.2s} .wave-bar:nth-child(4){animation-delay:0.3s}
        .wave-bar:nth-child(5){animation-delay:0.4s}
        @keyframes wave { 0%,100%{height:4px} 50%{height:14px} }

        .avatar-upload { display: none; }
        .avatar-upload-label {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 4px 12px;
            background: var(--glass-strong);
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 10.5px;
            color: var(--t3);
            cursor: pointer;
            transition: all 0.18s;
        }
        .avatar-upload-label svg { width: 11px; height: 11px; }
        .avatar-upload-label:hover { background: var(--glass-strong); color: var(--t1); border-color: rgba(10, 132, 255, 0.45); }

        /* Avatar switcher */
        .avatar-controls {
            display: inline-flex; align-items: center; gap: 5px;
            margin-top: 2px;
            position: relative;
            padding: 3px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid var(--border);
            border-radius: 999px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .avatar-switch-btn {
            width: 22px; height: 22px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--t2);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.18s;
            flex-shrink: 0;
        }
        .avatar-switch-btn svg { width: 10px; height: 10px; }
        .avatar-switch-btn:hover { color: var(--t1); background: var(--glass-strong); }
        .avatar-current-name {
            padding: 3px 12px;
            border: none;
            border-radius: 999px;
            background: transparent;
            color: var(--t1); font-size: 11px; font-weight: 600;
            cursor: pointer;
            transition: all 0.18s;
            white-space: nowrap;
        }
        .avatar-current-name:hover { color: var(--cyan); }
        .avatar-menu {
            position: absolute;
            top: calc(100% + 8px); left: 50%;
            transform: translateX(-50%);
            background: rgba(28, 28, 32, 0.82);
            backdrop-filter: blur(32px) saturate(180%);
            -webkit-backdrop-filter: blur(32px) saturate(180%);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 5px;
            display: none;
            z-index: 50;
            min-width: 140px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .avatar-menu.open { display: block; animation: fade-in 0.15s ease; }
        .avatar-menu-item {
            padding: 8px 11px;
            border-radius: 9px;
            font-size: 12px;
            cursor: pointer;
            display: flex; align-items: center; gap: 8px;
            transition: background 0.15s;
            color: var(--t2);
        }
        .avatar-menu-item:hover { background: var(--glass-strong); color: var(--t1); }
        .avatar-menu-item.active { color: var(--cyan); font-weight: 600; }
        .avatar-menu-item .check { width: 12px; color: var(--cyan); opacity: 0; }
        .avatar-menu-item.active .check { opacity: 1; }

        /* ===== Providers ===== */
        .provider-section { margin-bottom: 10px; }
        .provider-section:last-child { margin-bottom: 0; }
        .provider-section-title {
            font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--t3);
            margin-bottom: 6px;
            padding-left: 2px;
        }
        .provider-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 7px 11px;
            border-radius: 13px;
            margin-bottom: 4px;
            cursor: pointer;
            border: 1px solid transparent;
            background: rgba(255,255,255,0.025);
            transition: all 0.18s;
        }
        .provider-item:last-child { margin-bottom: 0; }
        .provider-item:hover { background: var(--glass-strong); }
        .provider-item.selected {
            background: linear-gradient(135deg, rgba(10,132,255,0.13), rgba(94,92,230,0.13));
            border-color: rgba(10, 132, 255, 0.45);
            box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.08), inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .provider-item.disabled { opacity: 0.4; cursor: not-allowed; }
        .tts-voice-row {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 11px 2px;
            font-size: 11px; color: var(--t3);
        }
        .tts-voice-row select {
            flex: 1; min-width: 0;
            background: rgba(255,255,255,0.05);
            color: var(--t1);
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            font-size: 11px;
            padding: 4px 6px;
            outline: none;
        }
        .provider-left { display: flex; align-items: center; gap: 9px; }
        .provider-radio {
            width: 16px; height: 16px;
            border: 2px solid var(--border-strong);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.18s;
            flex-shrink: 0;
        }
        .provider-item.selected .provider-radio { border-color: var(--blue); box-shadow: 0 0 8px rgba(10, 132, 255, 0.5); }
        .provider-item.selected .provider-radio::after {
            content: '';
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--grad);
        }
        .provider-name { font-size: 12px; font-weight: 600; }
        .provider-desc { font-size: 10px; color: var(--t3); margin-top: 1px; }
        .provider-status {
            font-size: 10px; font-weight: 600;
            padding: 3px 9px; border-radius: 999px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .provider-status.supported { background: rgba(48, 209, 88, 0.13); color: var(--ok); }
        .provider-status.loading { background: rgba(255, 159, 10, 0.13); color: var(--warn); }
        .provider-status.unsupported { background: rgba(255, 69, 58, 0.13); color: var(--danger); }

        /* ===== Messages ===== */
        .messages-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 100%;
            overflow-y: auto;
            padding: 2px;
        }
        .msg-item { max-width: 86%; }
        .msg-item.user { align-self: flex-end; }
        .msg-item.assistant { align-self: flex-start; }
        .msg-meta {
            display: flex; gap: 6px; align-items: center;
            font-size: 10px; color: var(--t3);
            margin: 0 8px 3px;
        }
        .msg-item.user .msg-meta { justify-content: flex-end; }
        .msg-text {
            padding: 10px 15px;
            font-size: 13.5px;
            line-height: 1.55;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .msg-item.user .msg-text {
            background: var(--grad);
            color: #fff;
            font-weight: 500;
            border-radius: 20px;
            border-bottom-right-radius: 7px;
            box-shadow: 0 4px 14px rgba(10, 132, 255, 0.25);
        }
        .msg-item.assistant .msg-text {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--hairline);
            border-radius: 20px;
            border-bottom-left-radius: 7px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
        }

        /* ===== Input ===== */
        .asr-status {
            font-size: 11px;
            color: var(--cyan);
            padding: 4px 2px;
            min-height: 18px;
        }
        .input-wrapper { display: flex; gap: 8px; align-items: center; }
        .input-field {
            flex: 1;
            height: 46px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 0 19px;
            color: var(--t1);
            font-size: 13.5px;
            outline: none;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
            transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
        }
        .input-field:focus {
            border-color: rgba(10, 132, 255, 0.65);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.16), inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .input-field::placeholder { color: var(--t3); }
        .input-field:disabled { opacity: 0.5; }

        .icon-btn {
            width: 46px; height: 46px;
            border-radius: 50%;
            background: var(--glass-strong);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border: 1px solid var(--border);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
            color: var(--t2);
            flex-shrink: 0;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .icon-btn svg { width: 18px; height: 18px; }
        .icon-btn:hover:not(:disabled) { border-color: rgba(10, 132, 255, 0.55); color: var(--t1); box-shadow: 0 0 14px rgba(10, 132, 255, 0.3), inset 0 1px 0 rgba(255,255,255,0.08); transform: translateY(-1px); }
        .icon-btn.listening { background: var(--danger); border-color: transparent; color: #fff; animation: pulse-btn 1s infinite; }
        @keyframes pulse-btn { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
        .icon-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .icon-btn.send {
            background: var(--grad);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 16px rgba(10, 132, 255, 0.45), inset 0 1px 0 rgba(255,255,255,0.25);
        }
        .icon-btn.send:hover:not(:disabled) { box-shadow: 0 6px 22px rgba(10, 132, 255, 0.6), inset 0 1px 0 rgba(255,255,255,0.25); color: #fff; transform: translateY(-1px); }

        /* ===== Status ===== */
        .status-list { display: flex; flex-direction: column; gap: 4px; }
        .status-row {
            display: flex; align-items: center; gap: 10px;
            padding: 7px 11px;
            background: rgba(255,255,255,0.03);
            border: 1px solid transparent;
            border-radius: 13px;
            font-size: 12px;
            transition: all 0.2s;
        }
        .status-row.active { background: rgba(48, 209, 88, 0.08); border-color: rgba(48, 209, 88, 0.28); }
        .status-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--t3);
            flex-shrink: 0;
        }
        .status-row.active .status-dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
        .status-label { color: var(--t2); font-weight: 500; min-width: 44px; }
        .status-value { margin-left: auto; color: var(--t1); font-weight: 600; font-size: 11.5px; }

        /* ===== Interrupt ===== */
        .interrupt-btn {
            width: 100%; height: 40px;
            border: 1px solid rgba(255, 69, 58, 0.35);
            border-radius: 999px;
            background: rgba(255, 69, 58, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: #ff6961;
            font-size: 12.5px; font-weight: 600;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.2s;
        }
        .interrupt-btn svg { width: 13px; height: 13px; }
        .interrupt-btn:hover:not(:disabled) { background: rgba(255, 69, 58, 0.18); border-color: rgba(255, 69, 58, 0.55); box-shadow: 0 0 14px rgba(255, 69, 58, 0.25); }
        .interrupt-btn:disabled { opacity: 0.35; cursor: not-allowed; }

        /* ===== Voice ===== */
        .voice-widget {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 8px;
        }
        .voice-status { font-size: 11px; color: var(--t2); }
        .voice-mic-btn {
            width: 64px; height: 64px;
            border-radius: 50%;
            border: none;
            background: var(--grad);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 8px 28px rgba(10, 132, 255, 0.45), inset 0 1px 0 rgba(255,255,255,0.25);
            color: #fff;
            flex-shrink: 0;
        }
        .voice-mic-btn svg { width: 26px; height: 26px; }
        .voice-mic-btn:hover { transform: scale(1.06); box-shadow: 0 10px 34px rgba(10, 132, 255, 0.55), inset 0 1px 0 rgba(255,255,255,0.25); }
        .voice-mic-btn.recording {
            background: var(--danger);
            color: #fff;
            animation: pulse-mic 1s infinite;
            box-shadow: 0 8px 30px rgba(255, 69, 58, 0.5);
        }
        @keyframes pulse-mic {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .voice-transcript {
            font-size: 12px; color: var(--t1); text-align: center;
            max-height: 40px; overflow: hidden;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 999px;
            width: 100%;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* ===== Voice Waveform ===== */
        .voice-wave-pill {
            display: none;
            align-items: center;
            justify-content: center;
            height: 30px;
            padding: 0 14px;
            background: rgba(10, 132, 255, 0.12);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border: 1px solid rgba(10, 132, 255, 0.32);
            border-radius: 999px;
            flex-shrink: 0;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .voice-wave-pill.large {
            height: 50px;
            padding: 0 18px;
            background: rgba(10, 132, 255, 0.14);
            border-color: rgba(10, 132, 255, 0.36);
            box-shadow: 0 4px 18px rgba(10, 132, 255, 0.18), inset 0 1px 0 rgba(255,255,255,0.08);
        }
/* Fixed width: the canvas attribute width is rewritten every frame (cssW * dpr),
           which feeds back into the percentage CSS width and makes an auto-width
           pill grow indefinitely under fractional zoom. */
        #voice-wave-pill-input { width: 110px; }
        .voice-wave-pill.active { display: flex; animation: voice-wave-in 0.22s ease-out; }
        @keyframes voice-wave-in {
            from { opacity: 0; transform: scaleX(0.6); }
            to   { opacity: 1; transform: scaleX(1); }
        }
        .voice-wave-pill.error { border-color: rgba(255, 69, 58, 0.5); }
        .voice-wave-canvas { display: block; width: 100%; height: 100%; }

        /* ===== Mobile Voice Widget ===== */
        .mobile-voice-widget {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 10px;
            position: relative;
        }
        .mobile-voice-bubble {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 6px 12px;
            font-size: 12px;
            color: var(--t1);
            max-width: 90%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            animation: bubble-in 0.2s ease-out;
        }
        @keyframes bubble-in { from { opacity: 0; transform: translateX(-50%) translateY(4px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        .mobile-voice-bubble.listening { color: var(--blue); border-color: rgba(10,132,255,0.4); }
        .mobile-voice-bubble.thinking { color: var(--t3); font-style: italic; }
        .mobile-voice-bubble.error { color: var(--danger); border-color: rgba(255,69,58,0.4); }

        /* Mic button */
        .mobile-mic-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid var(--blue);
            background: rgba(10,132,255,0.15);
            color: var(--blue);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            flex-shrink: 0;
        }
        .mobile-mic-btn:hover { background: rgba(10,132,255,0.25); transform: scale(1.05); }
        .mobile-mic-btn:active { transform: scale(0.95); }
        .mobile-mic-btn.recording {
            border-color: var(--danger);
            background: rgba(255,69,58,0.15);
            color: var(--danger);
            animation: mic-pulse 1.2s ease-in-out infinite;
        }
        .mobile-mic-btn svg { width: 28px; height: 28px; }
        @keyframes mic-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,69,58,0.4); }
            50% { box-shadow: 0 0 0 12px rgba(255,69,58,0); }
        }

        /* Ripple rings when recording */
        .mobile-voice-ripple {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .ripple-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid rgba(255,69,58,0.5);
            transform: translate(-50%, -50%) scale(0);
            animation: ripple-expand 1.8s ease-out infinite;
        }
        .ripple-ring:nth-child(2) { animation-delay: 0.6s; }
        .ripple-ring:nth-child(3) { animation-delay: 1.2s; }
        @keyframes ripple-expand {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
            100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
        }

        /* Send / Cancel row */
        .mobile-voice-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            animation: actions-in 0.2s ease-out;
        }
        @keyframes actions-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .mobile-voice-actions .action-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
        }
        .mobile-voice-actions .action-btn:active { transform: scale(0.93); }
        .mobile-voice-actions .send-btn {
            background: var(--blue);
            color: #fff;
            box-shadow: 0 4px 14px rgba(10,132,255,0.4);
        }
        .mobile-voice-actions .send-btn:hover { background: #0a6cd6; }
        .mobile-voice-actions .cancel-btn {
            background: var(--glass);
            color: var(--t2);
            border: 1px solid var(--border);
        }
        .mobile-voice-actions .cancel-btn:hover { color: var(--danger); border-color: rgba(255,69,58,0.4); }
        .mobile-voice-actions .action-btn svg { width: 20px; height: 20px; }

        /* Hint text */
        .mobile-voice-hint {
            font-size: 10px;
            color: var(--t3);
            text-align: center;
        }

        /* ===== Mobile Spectrogram (enhanced) ===== */
        .mobile-spec-widget {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 10px;
        }
        .mobile-spec-canvas { display: block; width: 100%; height: 100%; }
        .mobile-spec-label {
            position: absolute;
            bottom: 6px;
            font-size: 9px;
            letter-spacing: 0.08em;
            opacity: 0.5;
            pointer-events: none;
        }
        .mobile-spec-label.left { left: 8px; }
        .mobile-spec-label.right { right: 8px; }
        .mobile-spec-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            pointer-events: none;
            opacity: 0.6;
        }
        .mobile-spec-state.speaking { color: #ff375f; opacity: 0.8; }
        .mobile-spec-state.listening { color: var(--blue); }
        .mobile-spec-state.thinking { color: #bf5af2; }
        .mobile-spec-state.idle { color: var(--t3); }

        /* ===== Sci-Fi Spectrogram (TTS) ===== */
        .spectrogram-widget {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            overflow: hidden;
        }
        .spectrogram-canvas { display: block; width: 100%; height: 100%; }
        .spectrogram-label {
            position: absolute; top: 6px;
            font-size: 9px; letter-spacing: 1.2px; font-weight: 600;
            color: rgba(100, 210, 255, 0.55);
            font-family: 'SF Mono', 'Menlo', monospace;
            pointer-events: none;
        }
        .spectrogram-label.left { left: 10px; }
        .spectrogram-label.right { right: 10px; color: rgba(255, 55, 95, 0.55); }
        .spectrogram-status {
            position: absolute; bottom: 6px; left: 10px;
            font-size: 9px; letter-spacing: 1.2px;
            color: rgba(94, 92, 230, 0.6);
            font-family: 'SF Mono', 'Menlo', monospace;
            pointer-events: none;
        }
        .spectrogram-status.live { color: rgba(255, 55, 95, 0.85); animation: spectrogram-blink 1.4s ease-in-out infinite; }
        @keyframes spectrogram-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
        /* Spectrogram widget: full-bleed canvas, no chrome — header is hidden,
           padding collapsed to 0, content fills the whole box so the canvas
           stays exactly defaultW × defaultH. */
        .widget[data-type="spectrogram"] { padding: 0; }
        .widget[data-type="spectrogram"] .widget-content { flex: 1; min-height: 0; overflow: hidden; }

        /* ===== Empty State ===== */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--t3);
            gap: 10px;
        }
        .empty-icon { font-size: 34px; opacity: 0.6; filter: grayscale(0.4); }

        /* ===== Library ===== */
        #library-panel {
            position: fixed;
            left: 14px;
            top: 70px;
            background: rgba(28, 28, 32, 0.78);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            padding: 14px;
            display: none;
            z-index: 1000;
            box-shadow: 0 24px 64px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.1);
            min-width: 190px;
        }
        #library-panel.visible { display: block; animation: fade-in 0.15s ease; }
        @keyframes fade-in { from{opacity:0; transform:translateY(-4px) scale(0.98)} to{opacity:1; transform:none} }
        .library-title {
            font-size: 10.5px; font-weight: 600;
            letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--t3);
            margin-bottom: 10px;
            padding-left: 2px;
        }
        .library-items { display: flex; flex-direction: column; gap: 5px; }
        .library-item {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 12px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 13px;
            font-size: 12.5px; font-weight: 500;
            cursor: pointer;
            transition: all 0.18s;
        }
        .library-item svg { width: 15px; height: 15px; color: var(--cyan); flex-shrink: 0; }
        .library-item:hover { background: var(--glass-strong); border-color: rgba(10, 132, 255, 0.45); color: var(--t1); transform: translateX(2px); }

        /* ===== Scrollbar ===== */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 99px; border: 2px solid transparent; background-clip: content-box; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.24); background-clip: content-box; border: 2px solid transparent; }

        /* ===== Mobile ===== */
        @media (max-width: 640px) {
            #header { padding: 0 12px; gap: 6px; }
            .logo-text { display: none; }
            .hdr-btn { padding: 0 11px; font-size: 11.5px; height: 32px; gap: 4px; }
            .conn-badge { padding: 0 10px; font-size: 10.5px; height: 32px; }
            .ambient::before { width: 90vw; height: 90vw; left: -30vw; top: -25vw; }
            .ambient::after { width: 80vw; height: 80vw; right: -25vw; bottom: -30vw; }
        }
    </style>
</head>
<body>
    <div class="ambient"><div class="blob-center"></div></div>
    <div id="app">
        <div id="header">
            <div class="logo">
                <div class="logo-icon">AI</div>
                <div class="logo-text">Agent Voice Shell</div>
            </div>
            <div class="header-actions">
                <button class="hdr-btn" id="btn-settings" title="模型设置">

    <script>
        // State
        const state = {
            ws: null,
            isEditMode: false,
            isDragging: false,
            isResizing: false,
            dragWidget: null,
            startX: 0, startY: 0,
            startLeft: 0, startTop: 0,
            startW: 0, startH: 0,
            currentText: '',
            lastFinalText: '',
            lastSpokenLength: 0,
            pendingTail: '',
            asrProvider: 'browser-asr',
            ttsProvider: 'browser-tts',
            ttsVoiceName: localStorage.getItem('voice-shell-tts-voice') || '',
            localSherpaVoices: [],
            isSpeaking: false,
            assistantActive: false,
            isListening: false,
            voiceBase: '',
            voiceFinals: '',
            recognition: null,
            whisperPipeline: null,
            whisperLoading: false,
            whisperStream: null,
            whisperRecorder: null,
            whisperAudioCtx: null,
            whisperPCMBuffers: [],
            whisperSampleRate: 16000,
            ttsAudioQueue: [],
            ttsAudioCtx: null,
            ttsExpectedIndex: 0,
            avatarImage: null,
            avatarList: [],
            avatarName: null,
            avatarSheet: null,
            avatarMeta: { cols: 8, frameW: 192, frameH: 208, rows: { idle: 0, listening: 1, thinking: 2, speaking: 3, hover: 4, 'drag-left': 5, 'drag-right': 6, sleeping: 7 } }
        };

        const DEFAULT_AVATAR_META = {
  cols: 8, frameW: 192, frameH: 208, sheetH: 1872,
  rows: {
    idle: 0,
    listening: 1,
    thinking: 2,
    speaking: 3,
    hover: 4,
    'drag-left': 5,
    'drag-right': 6,
    sleeping: 7
  }
};

        // Elements
        const $ = id => document.getElementById(id);
        const canvas = $('canvas');
        const btnEdit = $('btn-edit');
        const btnSave = $('btn-save');
        const btnReset = $('btn-reset');
        const libraryPanel = $('library-panel');

        // Agent Status
        let agentStatusText = 'Idle';
        const statusConfig = {
            idle: { text: 'Idle', ring: 'idle', imgClass: 'idle', icon: '🧠' },
            listening: { text: 'Listening', ring: 'listening', imgClass: 'listening', icon: '👂' },
            thinking: { text: 'Thinking', ring: 'thinking', imgClass: 'thinking', icon: '💭' },
            speaking: { text: 'Speaking', ring: 'speaking', imgClass: 'speaking', icon: '🗣️' },
            hover: { text: 'Hi~', ring: 'idle', imgClass: 'hover', icon: '👋' },
            'drag-left': { text: '←', ring: 'idle', imgClass: 'drag-left', icon: '🤚' },
            'drag-right': { text: '→', ring: 'idle', imgClass: 'drag-right', icon: '🤚' },
            sleeping: { text: 'Zzz', ring: 'idle', imgClass: 'sleeping', icon: '💤' }
        };

        function initBrowserAsr() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return null;
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'zh-CN';
            recognition.maxAlternatives = 1;
            return recognition;
        }

        // ===== Whisper ASR (local) =====
        function _ensureWhisperStream() {
            if (state.whisperStream) return Promise.resolve();
            return navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then(stream => { state.whisperStream = stream; return stream; });
        }

        function _pcmChunks(sampleRate) {
            const buf = [];
            let offset = 0;
            const chunkSize = 1024;
            const factor = sampleRate / state.whisperSampleRate;
            const outSize = Math.round(chunkSize / factor);
            const downsample = factor > 1;

            return {
                push(f32) {
                    if (downsample) {
                        for (let i = 0; i < f32.length; i += factor) {
                            buf.push(f32[Math.floor(i)]);
                        }
                    } else {
                        buf.push(...f32);
                    }
                },
                flush() { return new Float32Array(buf); }
            };
        }

        async function startWhisperRecording() {
            const stream = await _ensureWhisperStream();
            const ac = new AudioContext({ sampleRate: state.whisperSampleRate });
            state.whisperAudioCtx = ac;
            const src = ac.createMediaStreamSource(stream);
            const analyser = ac.createAnalyser();
            analyser.fftSize = 2048;
            src.connect(analyser);

            // Visualize waveform on existing voice-wave canvases
            _startWaveformsFromAnalyser(analyser);

            const buf = _pcmChunks(ac.sampleRate);
            const processor = ac.createScriptProcessor(1024, 1, 1);
            processor.onaudioprocess = (e) => {
                if (state.asrProvider !== 'whisper') return;
                buf.push(e.inputBuffer.getChannelData(0));
            };
            src.connect(processor);
            processor.connect(ac.destination);
            state.whisperPCMBuffers = buf;
        }

        async function stopWhisperRecording() {
            if (state.whisperAudioCtx) {
                try { state.whisperAudioCtx.close(); } catch (e) {}
                state.whisperAudioCtx = null;
            }
            if (state.whisperStream) {
                state.whisperStream.getTracks().forEach(t => t.stop());
                state.whisperStream = null;
            }
            if (state.whisperRecorder) {
                try { state.whisperRecorder.stop(); } catch (e) {}
                state.whisperRecorder = null;
            }
        }

        async function transcribeWhisper() {
            const buf = state.whisperPCMBuffers;
            if (!buf || buf.length === 0) return '';
            const f32 = buf.flush();
            if (f32.length === 0) return '';
            const int16 = new Int16Array(f32.length);
            for (let i = 0; i < f32.length; i++) {
                const s = Math.max(-1, Math.min(1, f32[i]));
                int16[i] = s < 0 ? s * 32768 : s * 32767;
            }
            const pcm = int16.buffer;
            try {
                const res = await fetch('/api/asr/transcribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/octet-stream', 'X-Sample-Rate': String(state.whisperSampleRate) },
                    body: pcm
                });
                if (!res.ok) return '';
                const data = await res.json();
                return data.text || '';
            } catch (e) {
                return '';
            }
        }

        // For waveform visualization from an existing analyser (used by whisper)
        function _startWaveformsFromAnalyser(analyser) {
            if (!_waveCanvasCtx()) return;
            if (window._voiceAnalyser) return;
            window._voiceAnalyser = analyser;
        }

        function _waveCanvasCtx() {
            const c = document.getElementById('voice-wave-input') || document.getElementById('voice-wave-0');
            return c ? c.getContext('2d') : null;
        }

        let businessStatus = 'idle';
        let interactiveState = 'idle';

        function setAgentStatus(status) {
            businessStatus = status;
            agentStatusText = statusConfig[status]?.text || status;
            renderAvatarDisplay();
        }

        function setInteractive(state) {
            interactiveState = state;
            renderAvatarDisplay();
        }

        function renderAvatarDisplay() {
            const business = ['listening', 'thinking', 'speaking'].includes(businessStatus)
                ? businessStatus : null;
            const final = business || interactiveState;
            const cfg = statusConfig[final] || statusConfig.idle;

            document.querySelectorAll('.avatar-ring').forEach(el => el.className = 'avatar-ring ' + cfg.ring);
            document.querySelectorAll('.avatar-spritesheet').forEach(el => {
                el.className = 'avatar-spritesheet ' + cfg.imgClass;
            });
            document.querySelectorAll('.avatar-status').forEach(el => {
                el.className = 'avatar-status ' + businessStatus;
                el.textContent = cfg.text;
            });
            document.querySelectorAll('.avatar-wave').forEach(el => el.classList.toggle('hidden', businessStatus !== 'speaking'));
            updateStatusWidget();
        }

        function setConnectionStatus(connected) {
            $('conn-badge').classList.toggle('connected', connected);
            $('conn-text').textContent = connected ? 'Connected' : 'Disconnected';
            updateStatusWidget();
        }

        function updateStatusWidget() {
            const asrActive = document.querySelector('#voice-btn.listening, .voice-mic-btn.recording');
            document.querySelectorAll('.status-row').forEach(row => {
                const label = row.querySelector('.status-label')?.textContent;
                if (label === 'ASR') row.classList.toggle('active', !!asrActive);
                if (label === 'WS') row.classList.toggle('active', $('conn-badge').classList.contains('connected'));
                if (label === 'TTS') row.classList.toggle('active', state.isSpeaking);
            });
        }

        // ===== Avatar system =====
        async function loadAvatarList() {
            try {
                const res = await fetch('/api/avatars');
                const data = await res.json();
                state.avatarList = data.avatars || [];
            } catch (e) {
                console.error('loadAvatarList failed', e);
                state.avatarList = [];
            }
            if (state.avatarList.length === 0) return;
            const saved = localStorage.getItem('voice-shell-avatar');
            const found = state.avatarList.find(a => a.name === saved);
            applyAvatar(found || state.avatarList[0]);
        }

        async function applyAvatar(av) {
            if (!av) return;
            state.avatarName = av.name;
            state.avatarSheet = `/static/avatars/${av.name}/${av.sheet}`;
            const merged = Object.assign({}, DEFAULT_AVATAR_META, av.meta || {});
            merged.rows = Object.assign({}, DEFAULT_AVATAR_META.rows, (av.meta && av.meta.rows) || {});
            state.avatarMeta = merged;
            // Inject base style first so background-image is set before probe
            injectAvatarStyles();
            document.querySelectorAll('.avatar-spritesheet').forEach(el => {
                el.style.backgroundImage = `url(${state.avatarSheet})`;
            });
// Detect non-empty frame counts per row to avoid blank-frame flicker.
// Skip rows that the user explicitly overrode via meta.colsByRow.
            const detected = await detectFrameCounts(merged);
            if (detected) {
                merged.colsByRow = Object.assign({}, detected, merged.colsByRow || {});
                // Persist detection results to meta.json so we don't re-scan next time.
                // Only persist when the avatar has no pre-existing meta.json on the server.
                if (!av.meta || !av.meta.colsByRow) {
                    fetch(`/api/avatars/${encodeURIComponent(av.name)}/meta`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            cols: merged.cols,
                            frameW: merged.frameW,
                            frameH: merged.frameH,
                            sheetH: merged.sheetH,
                            rows: merged.rows,
                            colsByRow: detected,
                        }),
                    }).catch(() => {});
                }
            }
            // Switching clears any custom upload
            state.avatarImage = null;
            localStorage.setItem('voice-shell-avatar', av.name);
            injectAvatarStyles();
            document.querySelectorAll('.avatar-current-name').forEach(el => { el.textContent = av.name; });
            renderAvatarMenu();
            // Close any open menu
            document.querySelectorAll('.avatar-menu.open').forEach(m => m.classList.remove('open'));
        }

        function detectFrameCounts(meta) {
            // Scan sprite sheet to count non-empty frames per row.
            // Returns {rowIndex: frameCount} where frameCount = last non-empty col + 1.
            const img = document.querySelector('.avatar-spritesheet');
            if (!img) return null;
            const cs = getComputedStyle(img);
            const sheetW = parseFloat(cs.backgroundSize.split(' ')[0]) || meta.cols * meta.frameW;
            const sheetH = parseFloat(cs.backgroundSize.split(' ')[1]) || meta.sheetH || (meta.cols * meta.frameH);
            const url = cs.backgroundImage.replace(/^url\(["']?/, '').replace(/["']?\)$/, '');
            if (!url || url === 'none') return null;
            const tmp = document.createElement('div');
            tmp.style.cssText = 'position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;';
            const probe = document.createElement('img');
            probe.src = url;
            tmp.appendChild(probe);
            document.body.appendChild(tmp);
            const result = {};
            const check = () => {
                const w = probe.naturalWidth;
                const h = probe.naturalHeight;
                if (!w || !h) return null;
                const cols = Math.floor(w / meta.frameW);
                const rows = Math.floor(h / meta.frameH);
                const canvas = document.createElement('canvas');
                canvas.width = meta.frameW;
                canvas.height = meta.frameH;
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                for (let r = 0; r < rows; r++) {
                    let maxValidCol = -1;
                    for (let c = 0; c < cols; c++) {
                        ctx.clearRect(0, 0, meta.frameW, meta.frameH);
                        ctx.drawImage(probe, c * meta.frameW, r * meta.frameH, meta.frameW, meta.frameH, 0, 0, meta.frameW, meta.frameH);
                        const d = ctx.getImageData(0, 0, meta.frameW, meta.frameH).data;
                        let nonEmpty = 0;
                        for (let i = 0; i < d.length; i += 4) {
                            if (d[i + 3] > 10 && !(d[i] < 5 && d[i + 1] < 5 && d[i + 2] < 5)) nonEmpty++;
                        }
                        if (nonEmpty / (meta.frameW * meta.frameH) > 0.02) maxValidCol = c;
                    }
                    result[r] = maxValidCol >= 0 ? maxValidCol + 1 : 0;
                }
                return result;
            };
            if (probe.complete && probe.naturalWidth) {
                const r = check();
                document.body.removeChild(tmp);
                return r;
            }
            return new Promise(resolve => {
                probe.onload = () => {
                    const r = check();
                    document.body.removeChild(tmp);
                    resolve(r);
                };
                probe.onerror = () => {
                    document.body.removeChild(tmp);
                    resolve(null);
                };
            });
        }

        function injectAvatarStyles() {
            const m = state.avatarMeta;
            const sheetW = m.cols * m.frameW;
            const statuses = ['idle', 'listening', 'thinking', 'speaking', 'hover', 'drag-left', 'drag-right', 'sleeping'];
            const animSpeeds = { idle: '1.6s', listening: '0.8s', thinking: '1.2s', speaking: '0.6s', hover: '1.2s', 'drag-left': '0.4s', 'drag-right': '0.4s', sleeping: '2s' };
            const maxRow = Math.max(...statuses.map(s => m.rows[s] ?? 0));
            // bg-size must reflect the actual sprite-sheet dimensions to avoid stretching;
            // defaults to (maxRow+1)*frameH if the meta didn't include sheetH.
            const sheetH = m.sheetH || (maxRow + 1) * m.frameH;
            // Per-row frame count, used to skip blank trailing frames in animations.
            const colsByRow = m.colsByRow || {};
            let kfs = '';
            for (const s of statuses) {
                if (m.rows[s] === undefined) continue;
                if (s === 'idle') continue; // idle is static; no keyframes needed
                const row = m.rows[s];
                const y = -row * m.frameH;
                const n = Math.max(1, colsByRow[row] || m.cols);
                let frames = '';
                for (let i = 0; i < n; i++) {
                    const pct = (i / n) * 100;
                    frames += `  ${pct.toFixed(4)}% { background-position: ${-i * m.frameW}px ${y}px; }\n`;
                }
                // 100% wraps back to frame 0 so steps() cycles only the populated frames.
                frames += `  100% { background-position: 0 ${y}px; }\n`;
                kfs += `@keyframes spritesheet-${s} {\n${frames}}\n`;
            }
            const rules = statuses.map(s => {
                if (m.rows[s] === undefined) return '';
                const row = m.rows[s];
                const n = Math.max(1, colsByRow[row] || m.cols);
                // idle stays on frame 0 (static). All other states animate.
                if (s === 'idle') {
                    return `.avatar-spritesheet.${s} { background-position: 0 ${-row * m.frameH}px; }`;
                }
                return `.avatar-spritesheet.${s} { background-position: 0 ${-row * m.frameH}px; animation: spritesheet-${s} ${animSpeeds[s]} step-end infinite; }`;
            }).filter(Boolean).join('\n');

                        if (sprite) sprite.style.transform = `scale(${s})`;

                        new ResizeObserver(updateScale).observe(container);

                    // Mouse / touch interactivity
                    if (container) {

                            if (resetTimer) clearTimeout(resetTimer);
                            resetTimer = setTimeout(() => {
                                setInteractive(inside ? 'hover' : 'idle');

                        };

                        const handleMove = (x) => {
                            const now = Date.now();
                            if (lastX !== null) {
                                const dt = Math.max(1, now - lastT);
                                const dx = x - lastX;
                                const speed = Math.abs(dx) / dt;
                                if (speed > 0.4) {
                                    setInteractive(dx < 0 ? 'drag-left' : 'drag-right');
                                    resetToHover();
                                }
                            }
                            lastX = x;
                            lastT = now;

                            setInteractive('hover');

                        container.addEventListener('mouseleave', () => {
                            inside = false;
                            lastX = null;
                            setInteractive('idle');

                            handleMove(t.clientX);
                        }, { passive: true });

        // Create Widget
        function createWidget(type, x, y, w, h) {
            const template = widgetTemplates[type];
            if (!template) return;

            const widget = document.createElement('div');
            widget.className = 'widget';
            widget.dataset.type = type;

            const width = w || template.defaultW;
            const height = h || template.defaultH;
            widget.style.left = x + 'px';
            widget.style.top = y + 'px';
            widget.style.width = width + 'px';
            widget.style.height = height + 'px';

            widget.innerHTML = `
                <div class="widget-header">
                    <span class="widget-title">${template.title}</span>
                    <div class="widget-actions">
                        <button class="widget-btn remove" title="删除">✕</button>
                    </div>
                </div>
                <div class="widget-content">${template.content()}</div>
                <div class="resize-handle"></div>
            `;

            canvas.appendChild(widget);
            template.onCreate(widget);

            // Remove button
            widget.querySelector('.widget-btn.remove').addEventListener('click', (e) => {
                e.stopPropagation();
                widget.remove();
                saveLayout();
            });

            // Drag (only in edit mode) - mouse
            widget.addEventListener('mousedown', onWidgetMouseDown);
            widget.addEventListener('touchstart', onWidgetTouchStart, { passive: false });

            // Resize (only in edit mode) - mouse
            const handle = widget.querySelector('.resize-handle');
            handle.addEventListener('mousedown', onResizeMouseDown);
            handle.addEventListener('touchstart', onResizeTouchStart, { passive: false });

            // Apply edit mode state
            widget.classList.toggle('editing', state.isEditMode);

            return widget;
        }

        function onWidgetMouseDown(e) {
            if (!state.isEditMode) return;
            if (e.target.closest('.resize-handle') || e.target.closest('.widget-actions')) return;
            e.preventDefault();

            startDrag(e.currentTarget, e.clientX, e.clientY);
        }

        function onResizeMouseDown(e) {
            if (!state.isEditMode) return;
            e.preventDefault();
            e.stopPropagation();

            startResize(e.currentTarget.parentElement, e.clientX, e.clientY);
        }

        function onWidgetTouchStart(e) {
            if (!state.isEditMode) return;
            if (e.target.closest('.resize-handle') || e.target.closest('.widget-actions')) return;
            e.preventDefault();

            const touch = e.touches[0];
            startDrag(e.currentTarget, touch.clientX, touch.clientY);
        }

        function onResizeTouchStart(e) {
            if (!state.isEditMode) return;
            e.preventDefault();
            e.stopPropagation();

            const touch = e.touches[0];
            startResize(e.currentTarget.parentElement, touch.clientX, touch.clientY);
        }

        function startDrag(widget, clientX, clientY) {
            state.isDragging = true;
            state.dragWidget = widget;
            state.startX = clientX;
            state.startY = clientY;
            state.startLeft = parseFloat(state.dragWidget.style.left);
            state.startTop = parseFloat(state.dragWidget.style.top);
            state.dragWidget.classList.add('dragging');
        }

        function startResize(widget, clientX, clientY) {
            state.isResizing = true;
            state.dragWidget = widget;
            state.startX = clientX;
            state.startY = clientY;
            state.startW = state.dragWidget.offsetWidth;
            state.startH = state.dragWidget.offsetHeight;
            state.dragWidget.classList.add('resizing');
        }

        document.addEventListener('mousemove', (e) => {
            e.preventDefault();
            handleMove(e.clientX, e.clientY);
        });

        document.addEventListener('touchmove', (e) => {
            if (!state.isDragging && !state.isResizing) return;
            e.preventDefault();
            const touch = e.touches[0];
            handleMove(touch.clientX, touch.clientY);
        }, { passive: false });

        function handleMove(clientX, clientY) {
            if (state.isDragging && state.dragWidget) {
                const dx = clientX - state.startX;
                const dy = clientY - state.startY;

                let newLeft = state.startLeft + dx;
                let newTop = state.startTop + dy;

                state.dragWidget.style.left = newLeft + 'px';
                state.dragWidget.style.top = newTop + 'px';
            }

            if (state.isResizing && state.dragWidget) {
                const dx = clientX - state.startX;
                const dy = clientY - state.startY;

                const newW = Math.max(80, state.startW + dx);
                const newH = Math.max(60, state.startH + dy);

                state.dragWidget.style.width = newW + 'px';
                state.dragWidget.style.height = newH + 'px';
            }
        }

        document.addEventListener('mouseup', onEndDrag);
        document.addEventListener('touchend', onEndDrag);

        function onEndDrag() {
            if (state.isDragging || state.isResizing) {
                state.dragWidget?.classList.remove('dragging', 'resizing');
            }
            state.isDragging = false;
            state.isResizing = false;
            state.dragWidget = null;
        }

        // Toggle Edit Mode
        function toggleEditMode(on) {
            state.isEditMode = on;
            libraryPanel.classList.toggle('visible', on);
            btnEdit.style.display = on ? 'none' : 'inline-block';
            btnEdit.classList.toggle('active', !on);
            btnSave.style.display = on ? 'inline-block' : 'none';

            document.querySelectorAll('.widget').forEach(w => {
                w.classList.toggle('editing', on);
